prompt: "__debug__\r\nObjectif : Effectuer une recherche historique exhaustive sur le web et les archives pour reconstituer la totalité du palmarès du lutteur sénégalais nommé \"@wrestler\".\r\nRègles strictes à respecter :\r\nIDENTITÉ, HOMONYMES ET INCOHÉRENCES (RÈGLE D'OR) :\r\nTraite UNIQUEMENT \"@wrestler\". \r\n@synonyms\r\nChronologie cohérente : Fais très attention aux homonymes intergénérationnels. Exemple : un lutteur nommé \"Yanda\" actif de 2018 à 2026 ne peut pas avoir de combats en 1992. Analyse les dates pour isoler le bon lutteur et ne pollue jamais le palmarès avec les combats d'un ancien homonyme.\r\nDésambiguïsation stricte : Si tu trouves un adversaire nommé exactement \"Pape Mbaye\", remplace-le par le nom précis : \"Pape Mbaye 2 (Fadam)\", \"Pape Mbaye 2 (Keur Massar)\" ou \"Pape Mbaye Hersent\". Idem si tu trouves \"Boy Diop\" ou \"Diop 2\", précise : \"Boy Diop 1\", \"Boy Diop 2\", ou \"Boy Diop (Mbollo)\" (de l'écurie Yeumbel Mbollo). Meme remarque si tu tombes sur un lutteur nommé \"Alboury\" il faudrait en savoir plus sur lequel choisir entre \"Alboury (Kay Bakh)\", \"Alboury 2\" et \"Alboury\" tout court.\r\nPROTOCOLE DE RECHERCHE FORCÉE ET EXHAUSTIVITÉ (ANTI-PARESSE) :\r\nTu as l'obligation légale de chercher et remonter la TOTALITÉ absolue des combats réels de @wrestler. Prends tout ton temps, je cherche la liste la plus exhaustive possible.\r\nPrivilégie les vidéos YouTube existantes où les deux noms figurent dans le titre (utilise site:youtube.com \"@wrestler\" ou \"combat @wrestler\"). Pour les jeunes espoirs de l'arène, YouTube est la source principale, voire l'unique archive audiovisuelle (notamment via les chaînes comme Bantamba TV ou Gaston Productions ou sur Lutte TV). \r\nSi le lutteur a au moins un combat avant 2010, fouille impérativement les archives historiques de la presse sénégalaise (archives CNG, Sunu Lamb, Wal Fadjri, Le Soleil, fr.allafrica.com) pour remonter ses combats datant même des années 1980/1990/2000. Utilise les opérateurs de recherche (ex: site:seneweb.com \"@wrestler\").\r\nAUTHENTICITÉ ET SOURCES :\r\nUtilise uniquement des combats qui ont réellement eu lieu. Ne jamais inventer de données. Vérifie bien que chaque combat a effectivement eu lieu avant de le rajouter.\r\nINTERDICTION ABSOLUE : Toujours ignorer la source du domaine senlutteurs.com.\r\nFORMATAGE DU FLUX JSON OBLIGATOIRE :\r\n\"dte\" : Date du combat au format \"Y-m-d\". (Si seule l'année est connue, utilise le 1er janvier, ex: \"2023-01-01\").\r\n\"adv\" : Nom de l'adversaire de @wrestler, suivi de son écurie si tu as l'information (ex: \"Mbaye Bou Ndaw / Guédiawaye Mbollo\").\r\n\"res\" : Résultat du combat. Indiquer \"piv\" si le vainqueur est @wrestler. Sinon si défaite mettre comme valeur \"adv\". S'il y a un autre cas de figure, mettre la mention \"Nul\" ou \"Litige (sans verdict)\" selon le résultat réel ou sinon mais juste un \"?\" si tu n'en sais rien.\r\n\"ls\" : S'il s'agit d'un combat de lutte simple (sans frappe / gala), la valeur vaut \"1\". Sinon (avec frappe), la valeur vaut \"0\" par défaut.\r\nINSTRUCTIONS DE SORTIE STRICTES :\r\nNe retourne JAMAIS un tableau vide si au moins un combat est vérifié. Si très peu de combats valides sont trouvés, retourne quand même ceux qui respectent les critères.\r\nOutput must be EXCLUSIVELY a valid JSON array of objects. No additional text, no explanations, no formatting markers outside the JSON, no apologies, no notes whatsoever.\r\nStrictly follow the JSON format provided in the example below :\r\n[\r\n{\r\n\"dte\": \"2026-03-22\",\r\n\"adv\": \"Mbaye Bou Ndaw / Guédiawaye Mbollo\",\r\n\"res\": \"adv\",\r\n\"ls\": \"1\"\r\n},\r\n{\r\n\"dte\": \"2022-06-05\",\r\n\"adv\": \"THIATOU FASS\",\r\n\"res\": \"piv\",\r\n\"ls\": \"0\"\r\n}\r\n]"
