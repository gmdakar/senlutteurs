title: 关于
content:
  value: |-
    <p><strong>Senlutteurs AI</strong> 是一款用于探索和推广塞内加尔摔跤的数字工具，借助人工智能自动收集有关塞内加尔摔跤的公开体育数据。通过本网站，您可以搜索摔跤手的职业档案信息，并查阅其比赛历史：对手、日期、结果和判决。</p>
    <p>- 本网站不是新闻网站，只是利用技术来推广塞内加尔体育文化。目标是展示运动员、记录他们的表现，并让所有塞内加尔摔跤爱好者都能轻松获取这些信息。</p>
    <p>- <strong>如果您发现任何错误数据，可以随时</strong><a href="/zh-hans/contact"><strong>联系我们</strong></a><strong>进行更正</strong>（经确认后）。</p>
    <p>- <strong>本网站引用的 YouTube 视频或其他视频链接归其创作者和官方发行商所有。本网站对这些视频内容不拥有任何所有权，其所有权仍属于原作者</strong>。本网站仅对已在互联网上公开发布的视频进行索引。</p>
