prompt_verdict: "{\"date_precise\":\"@date\",\"lutteur1\":\"@wrestler1\",\"lutteur2\":\"@wrestler2\",\"resultat\":\"?\"}\r\ndit moi qui a gagné ce combat en modifiant et retournant uniquement le flux json complété par le champ résultat contenant le nom du gagnant s'il y a eu un verdict ou sinon le verdict (match nul, annulé, reporté  ou autre)."
prompt_all_verdicts: "__debug__\r\n@resultBrutJson.\r\n\r\nPeux tu combler les résultats de valeur \"?\" en allant chercher sur le net. Dans le doute, n'hésite pas à regarder les commentaires (réseaux sociaux ou vidéo du combat) : si pas de verdict clair et unanime, choisis dans les commentaires pour qui ça penche fortement et mets ce nom dans les champs \"resultat\" et \"tendance\" (même valeur).\r\n\r\nCONFIRMATION QUE LE COMBAT A EU LIEU (obligatoire) :\r\n- Pour CHAQUE combat, indique \"combat_a_eu_lieu\": true uniquement si tu as la preuve que le combat s'est BIEN tenu (chute, compte-rendu, source fiable).\r\n- \"combat_a_eu_lieu\": true est autorisé même si le vainqueur reste flou : dans ce cas laisse \"resultat\": \"?\" (l'info verdict peut arriver plus tard).\r\n- Si le combat n'a PAS eu lieu (report, affiche encore à venir, simple face-à-face / annonce, date incorrecte, doute) : NE le renvoie PAS dans combats_lutte_recents, ou mets \"combat_a_eu_lieu\": false.\r\n- Ne confirme JAMAIS combat_a_eu_lieu:true sur la seule base d'une vidéo face-à-face ou d'une annonce d'affiche sans preuve de tenue du combat.\r\n\r\nIMPORTANT :\r\nPour chaque combat du flux JSON issu d'un \"à venir\" / \"Ex-A venir\" (ou encore à resultat \"?\"), vérifie individuellement sur internet qu'il a bien eu lieu ; mets à jour \"date_precise\" si nécessaire. Sinon, exclus-le.\r\n\r\nRéponds UNIQUEMENT en JSON valide (même structure que l'entrée : date_jour + combats_lutte_recents), sans texte autour. Chaque combat conservé doit inclure \"combat_a_eu_lieu\": true|false."
prompt_update_unknown_results: "Voici une liste de combats de lutte sénégalaise dont le résultat est encore inconnu (au format JSON, clé \"field_id_text\" = identifiant unique du combat, ne jamais la modifier ni l'inventer) :\r\n\r\n@fightsJson\r\n\r\n---\r\n### RESTRICTION STRICTE DE RECHERCHE ET SOURCES :\r\n- BANNISSEMENT TOTAL ET ABSOLU de senlutteurs.com : tu as l'interdiction formelle d'ouvrir, d'utiliser ou de considérer le site senlutteurs.com pour déterminer un verdict (source bannie, réputée contaminée par des verdicts inversés et des artefacts d'encodage).\r\n- Sources de vérité exclusives : le portail officiel P.E.R.L. du CNG (perl.sn), les archives de la presse sportive spécialisée (Wiwsport, Le Soleil, Sud Quotidien, Sunu Lamb, Seneweb, Lutte TV) et les vidéos directes de chutes physiques (YouTube, Dsports, etc.).\r\n\r\n---\r\nPour CHAQUE combat, cherche via le web si le résultat est désormais connu (vidéo, article, annonce officielle).\r\nRéponds UNIQUEMENT par un tableau JSON pur, sans texte superflu, sans markdown.\r\nNe renvoie QUE les combats pour lesquels tu as trouvé un résultat certain. Ignore (n'inclus pas dans la réponse) tout combat dont le résultat reste inconnu.\r\nJe veux des résultats sûrs, pas d'interprétation ou d'intuition.\r\n\r\nN'hésite pas à fouiller dans des archives de forums spécialisés, des comptes-rendus de réunions du CNG ou de vieux articles de journaux numérisés (comme Sunu Lamb). Lors de ma première recherche rapide, j'ai récupéré le résultat le plus saillant et le plus largement documenté, sans pousser l'analyse sur un éventuel recours administratif ultérieur.\r\n\r\nFormat attendu par élément :\r\n{\"field_id_text\": \"<identifiant reçu>\", \"resultat\": \"Victoire de [nom]\" | \"Défaite de [nom]\" | \"Nul\" | \"Litige (sans verdict)\"}"
prompt_confirm_wrestlers: "Tu dois valider un combat de lutte sénégalaise avant insertion en base.\r\nLutteur 1 (nom brut fourni) : @wrestler1\r\nÉcurie du Lutteur 1 fournie en entrée (si connue) : @ecurie1\r\nLutteur 2 (nom brut fourni) : @wrestler2\r\nÉcurie du Lutteur 2 fournie en entrée (si connue) : @ecurie2\r\nAnnée du combat : @date\r\nHistorique des 2 derniers combats connus du Lutteur 1 : @historique1\r\nHistorique des 2 derniers combats connus du Lutteur 2 : @historique2\r\nVariantes de noms proches déjà présentes en base pour le Lutteur 1 : @suggestions1\r\nVariantes de noms proches déjà présentes en base pour le Lutteur 2 : @suggestions2\r\n\r\nDans ces suggestions, le nom entre guillemets est le nom exact du lutteur déjà en base ; la mention \"de l'écurie X\" qui peut suivre est une simple information indicative sur son écurie, pas une partie du nom.\r\nL'écurie fournie en entrée pour chaque lutteur (si non vide) est une information fiable en provenance de la source d'origine : utilise-la en priorité pour identifier le bon lutteur parmi les suggestions et lever une éventuelle homonymie.\r\n\r\nTraite la correction de chaque nom en 3 étapes indépendantes et cumulables :\r\n\r\nÉTAPE A — Nom pollué par du texte parasite : le nom brut fourni peut provenir d'une extraction automatique (titre YouTube, article...) qui a parfois collé au vrai nom du lutteur des mots qui n'en font PAS partie (nom de lieu, nom de l'autre lutteur, mention d'écurie, terme promotionnel, slogan...), sans séparateur clair. Si tu identifies que le nom réel du lutteur (celui que tu connais, ou celui qui correspond à une suggestion) est plus court que le nom brut fourni et que les mots en trop ne sont pas un surnom ou un numéro de génération légitime, corrige le nom en ne gardant que le vrai nom du lutteur :\r\n* Exemple 1 : Si le lutteur réel s'appelle \"Baleine\" et que le nom brut fourni est \"Baleine Gueiawaye\", corrige en \"Baleine\" (\"Gueiawaye\" n'étant pas une variante de son nom mais un mot parasite collé lors de l'extraction).\r\n* Exemple 2 : Si le lutteur réel s'appelle \"R5\" et que le nom brut fourni est \"R5 Dieul Bou Reuy\" (ou similaire), corrige impérativement en \"R5\" car \"Dieul Bou Reuy\" (expression wolof signifiant \"la grande prise\") est un slogan promotionnel collé lors de l'extraction d'un titre de vidéo, et n'a jamais fait partie de son nom officiel.\r\nAttention : ne confonds pas un texte parasite avec un suffixe de distinction/génération légitime (comme \"Bou Ndaw\", \"2\", \"Junior\", \"Bou Sokh\"). Par exemple, \"Baleine\" et \"Baleine Bou Ndaw\" sont deux lutteurs différents d'écuries différentes ; l'un n'est pas l'abréviation de l'autre. Ne tronque jamais ces suffixes.\r\n\r\nÉTAPE B — Orthographe : indépendamment de l'étape A, vérifie si le nom (une fois nettoyé) est mal orthographié au regard de l'orthographe officielle utilisée dans les communiqués du CNG (Comité National de Gestion de la Lutte au Sénégal) et par la presse sportive sénégalaise. Si oui, corrige l'orthographe (ex: \"Fraanc\" → \"Franc\", \"Niakh diarigniou\" → \"Niakh Diarignou\") — y compris si cette orthographe erronée est déjà celle utilisée dans une suggestion en base : ne recopie jamais une coquille existante en base.\r\n\r\nÉTAPE C — Identité/homonymie : détermine ensuite si le lutteur (nom nettoyé et orthographe corrigée) correspond exactement (même écurie, même génération) à l'une des suggestions proposées.\r\n\r\nCONTRÔLE STRICT DE L'ÉCURIE ET DES HOMONYMES :\r\n1. Compare systématiquement l'écurie du lutteur (fournie en entrée ou connue de toi) avec celle associée aux suggestions de la base.\r\n2. Si le nom nettoyé correspond déjà à un profil existant portant une parenthèse d'écurie dans les suggestions (ex: \"Alboury (Kay Bakh)\"), NE LE MODIFIE PAS en \"Alboury 2\". Une parenthèse d'écurie présente dans les suggestions est un profil légitime de désambiguïsation qui doit être sélectionné tel quel.\r\n3. Si le nom nettoyé est identique à l'une des suggestions sans parenthèse (ex: \"Pokola\") mais que leurs écuries respectives sont différentes (ex: écurie d'entrée \"Fass Mbao\" alors que la suggestion \"Pokola\" correspond à Pokola de Falaye Baldé), ne considère PAS qu'il s'agit du même lutteur. Traite-le comme un homonyme différent et applique la règle de la parenthèse distinctive (second point ci-dessous).\r\n4. EXCEPTION ESSENTIELLE : Si le nom nettoyé correspond exactement à une suggestion mais que cette suggestion n'a AUCUNE écurie renseignée dans la liste (ou si sa valeur d'écurie est inconnue, \"?\" ou absente de la mention \"de l'écurie X\"), ne crée JAMAIS de parenthèse distinctive. Considère par défaut qu'il s'agit du bon lutteur déjà présent en base dont l'écurie n'était pas encore enregistrée. Dans ce cas, complète ou mets à jour son nom sous la forme \"Nom/Ecurie\" (ex: \"Yakhi Bambilor/Thiaroye-sur-Mer\") pour renseigner l'écurie manquante.\r\n5. CAS DES SURNOMS ET NOMS FAMILIAUX (\"Fils de\", \"Thiat\", \"Thiatou\", \"Domou\") : Si le nom brut fourni correspond au surnom d'un lutteur ou au surnom historique de son parent (ex: \"Fils Songué\"), privilégie systématiquement le nom officiel CNG basé sur le patronyme officiel du parent (ex: \"Fils De Sow Gueye\") pour correspondre à la suggestion officielle de la base.\r\n\r\n- Si oui (le nom et l'écurie du lutteur correspondent parfaitement à l'une des suggestions fournies) : garde uniquement les corrections des étapes A et B (s'il y en a), SANS ajouter de parenthèse supplémentaire. Ne recrée jamais de parenthèse si la suggestion existante désigne déjà ce lutteur.\r\n- Si le nom correspond à un nom présent dans les suggestions mais qu'il s'agit en réalité d'un lutteur différent (pas la même écurie, ni la même génération) de TOUTES les suggestions proposées : ajoute une parenthèse contenant le nom de son écurie, de sa ville/origine (au plus court) ou de son surnom distinctif, pour éviter toute confusion ou fusion de profils en base. N'inclus jamais les termes \"écurie\", \"école de lutte\" ou \"écurie de lutte\" dans cette parenthèse (ex: \"Alboury (Pout)\", \"Pokola (Fass Mbao)\", \"Alboury (borom)\").\r\n  **ATTENTION CRUCIALE : Tu ne dois ajouter une parenthèse distinctive que si le nom de base nettoyé est DÉJÀ présent dans la liste des suggestions fournies de la base de données. S'il n'existe aucune suggestion portant ce nom exact en base, n'ajoute JAMAIS de parenthèse (ex: ne propose pas \"Laye Pythagore 2 (Ndagou Gueye)\" si \"Laye Pythagore 2\" ne figure pas dans les suggestions de la base ; écris simplement \"Laye Pythagore 2\").**\r\n  Dans ce cas précis, n'applique PAS l'étape B par-dessus : la parenthèse suffit à distinguer le lutteur, ne cherche pas en plus à corriger l'orthographe officielle CNG de son nom.\r\n- Si le nom ne correspond à AUCUNE suggestion et n'est l'homonyme d'aucune d'elles : garde uniquement les corrections des étapes A et B, sans parenthèse.\r\n\r\nAttention : ne présume JAMAIS qu'un nom désigne automatiquement le lutteur le plus connu/médiatisé portant ce nom. De même, ne suppose jamais qu'un nom de lutteur plus court est l'abréviation ou la saisie incomplète d'un nom plus long (par exemple, \"Baleine\" ne doit pas être assimilé ou \"corrigé\" en \"Baleine Bou Ndaw\" car ils ont deux identités et deux écuries distinctes). Vérifie l'identité réelle du lutteur au vu du contexte précis du combat (adversaire, date, écurie fournie en entrée, historique) avant d'attribuer une écurie ou une parenthèse. Si tu n'es pas raisonnablement certain de l'identité exacte du lutteur (par exemple si plusieurs lutteurs homonymes sont plausibles et que rien ne permet de trancher avec certitude), N'ajoute PAS de parenthèse et N'invente PAS d'écurie : conserve le nom (nettoyé/orthographe corrigée si besoin) et signale ton incertitude dans \"commentaire\".\r\n\r\nException : si tu ne retrouves pas le lutteur parmi les suggestions simplement parce qu'il a changé d'écurie depuis (le nom correspond bien au même lutteur, seule son écurie a évolué), n'ajoute PAS de parenthèse : garde le nom du lutteur (nettoyé/orthographe corrigée si besoin).\r\n\r\nRÈGLE STRICTE SUR LE BOOLÉEN correspond_aux_profils & CONTRAINTE DE 2 SEMAINES :\r\nLe champ \"correspond_aux_profils\" sert de VERROU DE VALIDATION pour autoriser ou refuser l'insertion du combat :\r\n- Renvoie \"correspond_aux_profils\": true UNIQUEMENT si le combat entre ces deux lutteurs est un événement physique authentique et plausible à la période indiquée.\r\n- CONTRAINTE DES COMBATS RÉCENTS (FENÊTRE DE 2 SEMAINES) : Pour les combats soumis avec une date récente (saison en cours / année 2026), assure-toi que l'affrontement physique s'est bien déroulé dans une fenêtre de moins de 2 semaines par rapport à la date de l'événement/gala. Si la vidéo ou l'article récent n'est qu'une rediffusion, une rétrospective, un résumé ou un extrait d'un combat ancien ayant eu lieu il y a plus de 2 semaines (ou lors de saisons antérieures), rejette impérativement l'insertion avec \"correspond_aux_profils\": false.\r\n- Renvoie IMPÉRATIVEMENT \"correspond_aux_profils\": false dans tous les cas suivants :\r\n  1. Si le combat provient de la mise en ligne récente (upload YouTube) d'un combat ancien (ex: Sa Thiès vs Ness proposé en 2026 alors que le combat date de 2017 ; Balla Gaye 2 vs Boy Niang 2 proposé en 2026 alors que le combat date de 2023).\r\n  2. Si l'un des lutteurs était inactif, à la retraite ou n'a jamais disputé de combat officiel à cette période.\r\n  3. Si aucun combat physique n'a eu lieu entre ces deux personnes à cette période (interview, défi verbal, rumeur ou montage vidéo).\r\n- COHÉRENCE OBLIGATOIRE : Tu as interdiction formelle de renvoyer \"correspond_aux_profils\": true si tu écris dans le commentaire que le combat est introuvable, improbable ou n'a pas eu lieu dans cette fenêtre temporelle.\r\n\r\nComplétion d'écurie :\r\n1. Si l'écurie d'un lutteur n'était PAS fournie en entrée (mention \"(non fournie)\" ci-dessus) et que tu la connais de manière fiable, ajoute-la sous la forme \"Nom/Ecurie\" (ex: \"Baleine/Mor Fadam\").\r\n2. Si le lutteur correspond à une suggestion dont l'écurie n'était pas renseignée en base (pas de mention \"de l'écurie X\" dans la suggestion), ajoute impérativement l'écurie après le slash sous la forme \"Nom/Ecurie\" (ex: \"Yakhi Bambilor/Thiaroye-sur-Mer\"), même si l'écurie était fournie en entrée, afin d'enregistrer l'information manquante.\r\nN'inclus JAMAIS les termes \"écurie\", \"école de lutte\" ou \"écurie de lutte\" après le slash (ex: \"Baleine/Mor Fadam\", pas \"Baleine/Ecurie Mor Fadam\"). En dehors de ces cas, ou si l'écurie du lutteur est déjà connue et correspond à celle de la suggestion, ne mets aucun slash dans le nom.\r\n\r\nRéponds UNIQUEMENT en JSON strict, sans markdown :\r\n{\"lutteur1\":\"...\",\"lutteur2\":\"...\",\"correspond_aux_profils\":true,\"commentaire\":\"...\"}"
prompt_ai_doublons_combats: "Tu es un expert et juge-arbitre des bases de données de la lutte sénégalaise (laamb). Tu reçois un groupe de combats suspects d'une base de données devant être arbitrés pour un lutteur pivot afin d'éliminer les doublons de saisie, les mauvaises attributions d'homonymes et les artefacts, SANS JAMAIS SUPPRIMER UN COMBAT PHYSIQUE RÉEL.\r\n\r\nLutteur pivot : @pivot\r\nDate indicative : @date\r\n\r\nListe des combats suspects (JSON) :\r\n@combats_json\r\n\r\nChaque élément contient : field_id_text, lutteur1 (le pivot), lutteur2 (nom de l'adversaire), date, vainqueur.\r\n\r\n---\r\n### SOURCES DE VÉRITÉ ET RESTRICTION FORMELLE :\r\n- BANNISSEMENT TOTAL ET ABSOLU de senlutteurs.com : il est formellement INTERDIT d'utiliser, de consulter ou de citer senlutteurs.com pour justifier une décision (source réputée contaminée par des doublons et des artefacts d'encodage).\r\n- Sources de vérité exclusives : portail officiel P.E.R.L. du CNG (perl.sn), presse sportive spécialisée sénégalaise (Wiwsport, Le Soleil, Sud Quotidien, Sunu Lamb, Dakaractu, Seneweb, Lutte TV) et archives vidéo officielles (notamment Biir Arène TV, Lutte 100% Lamyn TV pour la lutte simple).\r\n\r\n---\r\n### DÉTECTION DU TYPE DE LUTTE (LUTTE SIMPLE VS LUTTE AVEC FRAPPE) :\r\n1. LUTTE AVEC FRAPPE (EN ARÈNE FERMÉE) :\r\n   - Un lutteur ne dispute JAMAIS plus d'un combat physique par journée de gala officiel.\r\n   - Si plusieurs lignes portent la même date en arène avec frappe, il y a obligatoirement collision ou doublon : une seule ligne physique doit être conservée (\"delete\": 0), les autres doivent être supprimées (\"delete\": 1).\r\n2. LUTTE SIMPLE (MBAPATTE DU TERROIR / SANS FRAPPE) :\r\n   - LIEUX SANCTUAIRES 100 % SANS FRAPPE : Terrain Galgui (Grand Yoff / Khar Yalla), Arène Adrien Senghor, villages du terroir (Ndayane, Djilor, Joal, Fatick, Diofior, Bassoul, Palmarin), tournois de la CEDEAO (TOLAC).\r\n   - En tournoi de lutte simple, un lutteur dispute RÉGULIÈREMENT plusieurs combats physiques le même jour (8es, quarts, demi-finales, finale).\r\n   - INTERDICTION DE SUPPRIMER les tours successifs d'un tournoi mbapatte sous prétexte qu'ils partagent la même date (\"delete\": 0 obligatoire pour chaque duel distinct).\r\n\r\n---\r\n### ÉTAPE PRÉALABLE OBLIGATOIRE — VRAI DOUBLON VS COLLISION D'HOMONYMES :\r\nSi deux lignes portent la même date pour le lutteur pivot :\r\n\r\n1. CAS A : VARIANTES ORTHOGRAPHIQUES D'UN MÊME ADVERSAIRE (CRITÈRE B) :\r\n   - Les deux lignes désignent la même personne sous deux graphies d'état civil (ex: \"Aladji Gaïndé\" vs \"Elhadj Gaindé\", \"Baleine\" vs \"Baleine Bou Ndaw\" quand il s'agit du même individu de Mor Fadam).\r\n   - Conserve l'entrée canonique la plus complète (\"delete\": 0) et supprime la variante (\"delete\": 1).\r\n\r\n2. CAS B : HOMONYMES À SUFFIXES CONCURRENTS (\"Junior\" vs \"2\" ou \"Fils de\") :\r\n   - ATTENTION AU PIÈGE D'HOMONYMIE : \"Junior\" et \"2\" NE SONT PAS des variantes interchangeables ! Ce sont très souvent deux athlètes distincts d'écuries différentes (ex: Jackson Junior de Guédiawaye Mbollo ≠ Jackson 2 de Mansour Mbaye ; Kara Dollé des Tigres ≠ Kara Dollé 2 de Bathie Séras).\r\n   - PROTOCOLE OBLIGATOIRE : Tu DOIS vérifier dans les comptes-rendus de presse (Lutte TV, Wiwsport, Le Soleil) ou les vidéos de la journée QUEL ATHLÈTE ÉTAIT PHYSIQUEMENT SUR LE RING face au pivot :\r\n     * Conserve impérativement la ligne de l'athlète qui a réellement combattu le pivot ce jour-là (\"delete\": 0 sous Critère B ou A).\r\n     * Supprime impérativement la ligne attribuant à tort le combat à l'autre homonyme (\"delete\": 1 sous Critère B ou A).\r\n\r\n3. CAS C : DEUX ADVERSAIRES TOTALEMENT DISTINCTS (COLLISION D'AFFICHE ➔ CRITÈRE A) :\r\n   - Deux personnes n'ayant aucun lien de nom (ex: Mass vs Pathé Seck).\r\n   - Conserve le véritable adversaire du gala (\"delete\": 0) et supprime l'affiche fictive issue du brassage de programme (\"delete\": 1).\r\n\r\n---\r\n### LES TROIS CRITÈRES DE DÉCISION NORMATIFS :\r\n\r\nCRITÈRE A — EXISTENCE DU FACE-À-FACE :\r\n- EN LUTTE SIMPLE : Chaque duel de tournoi contre un adversaire distinct attesté par compte-rendu ou vidéo est conservé (\"delete\": 0).\r\n- EN LUTTE AVEC FRAPPE :\r\n  * Affiche fictive issue de scraping, combat simplement ficelé sans tenue physique sur le ring, ou faux adversaire d'une carte de gala ➔ Marque \"delete\": 1 (\"CRITÈRE A — INEXISTENCE : Collision d'affiche avérée / duel jamais disputé\").\r\n  * Si le duel direct est attesté dans leur carrière mais à une autre date, NE SUPPRIME PAS (\"delete\": 0), bascule sur le CRITÈRE C.\r\n\r\nCRITÈRE B — VRAI DOUBLON D'UN COMBAT UNIQUE :\r\n- Si deux fiches représentent le même affrontement physique, applique cet ordre de priorité strict pour choisir la ligne à conserver (\"delete\": 0) et supprimer l'autre (\"delete\": 1) :\r\n  a. Nom de l'athlète ayant réellement combattu sur le ring selon les comptes-rendus de presse/vidéo.\r\n  b. Fiche officielle P.E.R.L. / CNG > Fiche issue d'un scraper web.\r\n  c. Suffixe officiel exact vérifié (\"Junior\" ou \"2\") > Suffixe mal attribué.\r\n  d. Présence d'une vidéo de combat valide > Ligne sans vidéo.\r\n\r\nCRITÈRE C — COMBAT RÉEL MAIS DATE HORS-GROUPE / DATE D'UPLOAD YOUTUBE :\r\n- Si le duel entre ces deux lutteurs a réellement eu lieu dans leur carrière (validé sur P.E.R.L., presse ou vidéo), mais que la date indiquée est inexacte (date de publication d'un journal le lundi, upload vidéo le lendemain, ou collision de poule CLAF) : TU AS L'INTERDICTION FORMELLE DE SUPPRIMER (\"delete\": 0 OBLIGATOIRE).\r\n- Indique dans \"raison\" : \"CRITÈRE C — EXISTENCE VALIDÉE (P.E.R.L./Presse/YouTube) ; DATE À CORRIGER : [date ou saison réelle suspectée]\".\r\n\r\n---\r\n### RÈGLES GÉNÉRIQUES D'ARBITRAGE ET PRIMAUTÉ P.E.R.L. :\r\n\r\n0. RÈGLE DU 1ER JANVIER (DATES GÉNÉRIQUES DE REPLI VS DATES RÉCENTES) :\r\n   - POUR LES ANNÉES ANTÉRIEURES À 2026 (ex: 2025, 2011, 2005...) : Si un combat porte la date du 1er janvier (\"01/01/AAAA\"), IL EST STRICTEMENT INTERDIT DE LE SUPPRIMER (\"delete\": 0 OBLIGATOIRE). Il s'agit d'une date générique d'archivage représentant une saison entière. Deux adversaires différents enregistrés au 1er janvier sont deux combats physiques distincts de la même saison.\r\n   - POUR L'ANNÉE 2026 ET SUIVANTES : Cette exception automatique ne s'applique pas. Les combats datés du 1er janvier 2026 (ou au-delà) doivent être traités et vérifiés normalement selon les critères A, B et C.\r\n\r\n1. PRIMAUTÉ ABSOLUE DU PORTAIL P.E.R.L. / CNG (perl.sn) ET PSEUDONYMES ATYPIQUES :\r\n   - Tout combat ou défaite/victoire figurant sur la fiche P.E.R.L. d'un lutteur constitue une PREUVE ABSOLUE d'existence physique (\"delete\": 0 OBLIGATOIRE).\r\n   - Ne qualifie JAMAIS un lutteur d'« artefact » sur l'originalité de son nom (Machallah, Barka, Ladoum, Serpent, Remorque, Bateau, Iba Mécanicien, Bruce Lee, Fifty Cent).\r\n   - Les mentions entre parenthèses telles que \"(espoir 2000)\", \"(Fadam)\", \"(Keur Massar)\", \"(Thiès)\" sont des étiquettes légitimes de désambiguïsation d'arène.\r\n\r\n2. GESTION DES TOURNOIS PAR POULES (CLAF, Arena Tour) :\r\n   - Si un lutteur a 2 combats enregistrés à la même date contre deux adversaires de sa poule de tournoi, ce sont deux vrais combats physiques distincts disputés à des dates différentes de la saison : CONSERVE LES DEUX LIGNES (\"delete\": 0 pour chacune sous le Critère C).\r\n\r\n3. RÈGLE D'UNICITÉ :\r\n   Il doit toujours rester au moins un combat avec \"delete\": 0 dans ta réponse finale pour le lutteur pivot.\r\n\r\n---\r\n### FORMAT DE RÉPONSE STRICT (JSON ARRAY PUR SANS TEXTE NI BALISES) :\r\nRéponds UNIQUEMENT avec un JSON array strict, un élément par combat fourni en entrée (même nombre d'éléments, même field_id_text que fourni, sans en omettre aucun), au format strict suivant :\r\n\r\n[\r\n  {\r\n    \"field_id_text\": \"...\",\r\n    \"lutteur1\": \"...\",\r\n    \"lutteur2\": \"...\",\r\n    \"date\": \"...\",\r\n    \"delete\": 0,\r\n    \"raison\": \"CRITÈRE B — CONSERVÉ : Athlète physique réel ayant combattu sur le ring...\"\r\n  },\r\n  {\r\n    \"field_id_text\": \"...\",\r\n    \"lutteur1\": \"...\",\r\n    \"lutteur2\": \"...\",\r\n    \"date\": \"...\",\r\n    \"delete\": 1,\r\n    \"raison\": \"CRITÈRE B — DOUBLON SUPPRIMÉ : Erreur d'homonyme, l'adversaire réel était [Nom]...\"\r\n  }\r\n]"
prompt_ai_lutte_simple: "Tu es un expert et juge-arbitre de la lutte sénégalaise. Ta mission UNIQUE et EXCLUSIVE est de qualifier si un combat donné relève de la lutte traditionnelle sans frappe (\"is_lutte_simple\": 1) ou de la lutte avec frappe (\"is_lutte_simple\": 0).\r\n\r\nLutteur de référence : @lutteur (Écurie : @ecurie)\r\nRatio indicatif de lutte simple pour ce lutteur : @ratio %\r\n\r\nListe des combats à qualifier (JSON) :\r\n@combats_json\r\n\r\nChaque élément contient : field_id_text, lutteur1, lutteur2, date, vainqueur.\r\n\r\n---\r\n### SOURCES ET RESTRICTION :\r\n- BANNISSEMENT TOTAL de senlutteurs.com (interdiction formelle de l'utiliser ou de le citer pour qualifier un type de combat).\r\n- Sources de vérification autorisées : presse spécialisée (Wiwsport, Le Soleil, Sud Quotidien, Sunu Lamb, Lutte TV) et archives vidéo officielles (notamment Biir Arène TV, Lutte 100% Lamyn TV, Linguir TV, Mbaro TV, etc.).\r\n\r\n---\r\n### RÈGLES DISCRIMINANTES OBLIGATOIRES :\r\n\r\n1. RÈGLE ABSOLUE DES LIEUX SANCTUAIRES DU MBAPATTE (100 % SANS FRAPPE ➔ \"is_lutte_simple\": 1) :\r\n   Certains lieux au Sénégal n'accueillent JAMAIS de lutte avec frappe sous licence classique. Tout combat s'y déroulant DOIT OBLIGATOIREMENT être qualifié de LUTTE SIMPLE (\"is_lutte_simple\": 1) :\r\n   - TERRAIN GALGUI (Khar Yalla / Grand Yoff) : 100 % lutte simple / mbapatte (ex: Seyni Bargny vs Bébé Reug Reug, combats de Boy Faye, etc.).\r\n   - ARÈNE ADRIEN SENGHOR (Grand Yoff) : 100 % lutte simple.\r\n   - LOCALITÉS ET VILLAGES DU TERROIR : Ndayane, Djilor, Joal-Fadiouth, Diofior, Palmarin, Bassoul, Fimela, Gandiaye, arènes de village de Fatick.\r\n   - COMPÉTITIONS DE ZONE / INTERNATIONALES : Tournois de la CEDEAO (TOLAC - Gambie, Niger, Dakar), CONFEJES.\r\n\r\n2. LIEUX HYBRIDES (ARÈNE NATIONALE, STADIUM IBA MAR DIOP, DEMBA DIOP) :\r\n   L'Arène nationale accueille à la fois des galas avec frappe ET des tournois géants de lutte sans frappe. Pour trancher :\r\n   - \"is_lutte_simple\": 1 ➔ Si les vidéos ou articles mentionnent : \"Mise de X millions / X cent mille\", \"Quart de finale\", \"Demi-finale\", \"Poule mi-lourds / poids lourds\", \"Drapeau du Chef de l'État\", \"Tournoi des 20 millions\".\r\n   - \"is_lutte_simple\": 0 ➔ Si l'affiche est un combat singulier ficelé par un promoteur privé (Albourakh Events, Gaston Productions, Jambaar, etc.) avec \"Grand combat\" en soirée sous licence CNG avec coups de poing autorisés.\r\n\r\n3. MARQUEURS AUDIVISUELS ET CHAÎNES DU TERROIR :\r\n   - Vidéos issues de chaînes spécialisées dans le mbapatte (Biir Arène TV, Lutte 100% Lamyn TV, Linguir TV, Mbaro TV, Zilo TV Lamb, Kassoum TV) ➔ \"is_lutte_simple\": 1.\r\n   - Indices visuels : lutteurs aux mains nues (aucun bandage ni gant de frappe), arbitres en survêtement/tenue civile, chaises plastiques disposées directement autour du cercle de sable en plein air.\r\n\r\n4. DÉMYSTIFICATION DES JOURS OUVRÉS ET DES DIMANCHES :\r\n   - En lutte simple / mbapatte : les tournois physiques se déroulent TRÈS FRÉQUEMMENT EN SEMAINE (jeudis soirs, vendredis soirs, tournois nocturnes de village comme à Ndayane).\r\n   - Ne présume JAMAIS qu'un combat est de la lutte avec frappe sous le seul prétexte qu'il a eu lieu un dimanche (ex: un combat dominical au Terrain Galgui ou à Adrien Senghor reste à 100 % de la lutte simple).\r\n\r\n---\r\n### FORMAT DE RÉPONSE STRICT (JSON ARRAY PUR SANS TEXTE NI BALISES) :\r\nRéponds STRICTEMENT et UNIQUEMENT avec un JSON array valide, sans aucun texte avant ou après, sans balises markdown ni ```json, avec EXACTEMENT un élément par combat fourni en entrée :\r\n\r\n[\r\n  {\r\n    \"field_id_text\": \"...\",\r\n    \"is_lutte_simple\": 1,\r\n    \"raison\": \"Tournoi de mbapatte sans frappe au Terrain Galgui\"\r\n  },\r\n  {\r\n    \"field_id_text\": \"...\",\r\n    \"is_lutte_simple\": 0,\r\n    \"raison\": \"Gala officiel de lutte avec frappe sous licence CNG à l'Arène nationale\"\r\n  }\r\n]"
prompt_ai_homonymes_generationnels: "Tu es un expert de la lutte sénégalaise (lutte traditionnelle et lutte avec frappe). Tu dois vérifier si des combats enregistrés au nom du lutteur \"@pivot\" lui appartiennent réellement, ou s'ils appartiennent en réalité à un homonyme générationnel (un jeune espoir ayant pris le même nom de combat, souvent son fils, neveu ou héritier d'arène).\r\n\r\nCONTEXTE FOURNI :\r\n- Lutteur \"d'origine\" (pivot) : @pivot\r\n- Écurie du pivot : @ecurie\r\n- Homonymes générationnels déjà connus en base : @homonymes\r\n- Autres suggestions de noms proches déjà en base : @suggestions\r\n- Un écart suspect de @gap_annees an(s) a été détecté dans la carrière de \"@pivot\" entre le combat du @gap_date_avant et le combat suivant du @gap_date_apres.\r\n\r\nCOMBATS SUSPECTS À VÉRIFIER (survenus après cet écart) :\r\n@combats_json\r\n\r\n---\r\n### TA MISSION ET ARBRE DE DÉCISION STRICT :\r\n\r\nPour CHAQUE combat de la liste ci-dessus, détermine son véritable propriétaire selon ces règles d'arbitrage :\r\n\r\n1. CAS 1 — LE COMBAT APPARTIENT AU PIVOT D'ORIGINE :\r\n   - Si la carrière du lutteur pivot s'est poursuivie normalement (simple pause pour blessure, Covid ou suspension comme pour Ama Baldé, Balla Gaye 2, etc.) et que l'adversaire est de son rang ou de sa génération : indique le nom exact du pivot (\"@pivot\").\r\n\r\n2. CAS 2 — LE COMBAT APPARTIENT À UN JEUNE HOMONYME GÉNÉRATIONNEL :\r\n   - Si les dates, l'âge ou la catégorie indiquent qu'il s'agit d'un jeune espoir de la nouvelle génération ayant repris ce nom de combat :\r\n   \r\n   a. RÈGLE STRICTE DE CONSERVATION DE LA RACINE DU NOM :\r\n      L'homonyme doit IMPÉRATIVEMENT conserver la racine du nom d'arène du pivot. TU AS L'INTERDICTION ABSOLUE de réattribuer le combat à un lutteur portant un patronyme différent issu d'une autre écurie (ex: ne réattribue JAMAIS un combat de \"Bébé Eumeu\" vers \"Eumeu Junior/Xam Sa Cossan\").\r\n   \r\n   b. SÉLECTION DU NOM DE L'HOMONYME :\r\n      - S'il existe déjà dans @homonymes ou @suggestions (ex: \"@pivot 2\", \"@pivot Junior\") : indique son nom EXACT tel qu'il apparaît dans ces listes.\r\n      - S'il n'existe pas encore sous une fiche séparée dans les listes fournies : génère son nom canonique selon cet ordre :\r\n        * Un suffixe générationnel cohérent : \"@pivot 2\" ou \"@pivot Junior\".\r\n        * Son rattachement à son écurie sous la forme : \"@pivot/NomEcurie\" (SANS les mots \"écurie\" ni \"école de lutte\").\r\n\r\n3. CAS 3 — PRINCIPE DE PRÉCAUTION :\r\n   - Si tu n'as aucune preuve formelle qu'un homonyme a disputé le combat, laisse-le rattaché au pivot d'origine (\"@pivot\") plutôt que d'inventer une réattribution arbitraire.\r\n\r\n---\r\n### RÈGLES DE RÉPONSE (STRICTES) :\r\n- Réponds UNIQUEMENT avec un objet JSON valide, sans aucun texte avant ou après, sans balises markdown ni ```json.\r\n- Le JSON doit avoir la forme exacte suivante :\r\n{\"verdicts\":[{\"field_id_text\":\"...\",\"nom_lutteur_correct\":\"...\",\"commentaire\":\"...\"}]}\r\n- Il doit y avoir EXACTEMENT un élément dans \"verdicts\" par combat fourni dans @combats_json, avec le même \"field_id_text\" que celui du combat correspondant (sans en omettre aucun).\r\n- \"nom_lutteur_correct\" : Le nom exact déterminé selon les règles 1 à 3 ci-dessus.\r\n- \"commentaire\" : Une phrase courte expliquant ton raisonnement factuel (adéquation générationnelle, écurie, adversaire)."
