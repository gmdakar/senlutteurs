_core:
  default_config_hash: zzgpgFFYVnDh4Bu8k2ZNyNtoVeOOmmjTKvv41SWyRXo
seckit_xss:
  csp:
    checkbox: true
    vendor-prefix:
      x: false
      webkit: false
    report-only: false
    default-src: "'self'"
    script-src: "'self' 'unsafe-inline' https://www.youtube.com https://www.google.com https://www.dailymotion.com https://geo.dailymotion.com https://cdn.jsdelivr.net https://senlutteurs.com https://www.senlutteurs.com"
    object-src: "'none'"
    style-src: "'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net"
    img-src: "'self' data: https: https://s1.dmcdn.net https://www.senlutteurs.com https://senlutteurs.com"
    media-src: "'self'"
    frame-src: "'self' https://www.youtube.com https://www.dailymotion.com https://geo.dailymotion.com https://senlutteurs.com https://www.senlutteurs.com"
    frame-ancestors: "'self'"
    child-src: "'self'"
    font-src: "'self' https://fonts.googleapis.com https://fonts.gstatic.com https://cdn.jsdelivr.net"
    connect-src: "'self' https://senlutteurs.com https://www.senlutteurs.com https://cdn.jsdelivr.net"
    report-uri: /report-csp-violation
    upgrade-req: true
    policy-uri: ''
  x_xss:
    select: 1
seckit_csrf:
  origin: true
  origin_whitelist: ''
seckit_clickjacking:
  js_css_noscript: false
  noscript_message: 'Sorry, you need to enable JavaScript to visit this website.'
  x_frame: '0'
  x_frame_allow_from: ''
seckit_ssl:
  hsts: true
  hsts_subdomains: true
  hsts_max_age: 31536000
  hsts_preload: true
seckit_ct:
  expect_ct: true
  max_age: 86400
  report_uri: ''
  enforce: true
seckit_fp:
  feature_policy: true
  feature_policy_policy: "geolocation 'none'; microphone 'none'; camera 'none'"
seckit_various:
  from_origin: false
  from_origin_destination: same
  referrer_policy: true
  referrer_policy_policy: strict-origin-when-cross-origin
  disable_autocomplete: true
