title: عن
content:
  value: |-
    <p><strong>Senlutteurs AI</strong> هي أداة رقمية لاكتشاف واستكشاف رياضة المصارعة السنغالية، مدعومة بالذكاء الاصطناعي لجمع البيانات الرياضية العامة المتعلقة بها تلقائيًا. من خلال هذا الموقع، يمكنك البحث عن معلومات حول الملف المهني للمصارع والاطلاع على تاريخ مبارياته: الخصوم، التواريخ، النتائج والأحكام.</p>
    <p>- هذا الموقع ليس موقع أخبار؛ بل يستخدم التكنولوجيا ببساطة لتعزيز الثقافة الرياضية السنغالية. الهدف هو عرض الرياضيين وتوثيق أدائهم وتسهيل الوصول إليهم لجميع عشاق المصارعة السنغالية.</p>
    <p>- <strong>إذا وجدت أي بيانات غير صحيحة، يمكنك دائمًا </strong><a href="/ar/contact"><strong>الاتصال بنا</strong></a><strong> للتصحيح</strong>، إذا تم التأكيد.</p>
    <p>- <strong>روابط مقاطع فيديو يوتيوب أو غيرها من مقاطع الفيديو المشار إليها في هذا الموقع تعود لمبدعيها والموزعين الرسميين. لا يمتلك هذا الموقع أي حقوق ملكية على محتوى هذه الفيديوهات، التي تبقى ملكًا لمؤلفيها</strong>. إنه ببساطة يفهرس مقاطع الفيديو التي نُشرت بالفعل علنًا على الإنترنت.</p>
  format: full_html
