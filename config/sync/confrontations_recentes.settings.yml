prompt_ai_cross_athlete_doublons: "Tu es un expert en lutte sénégalaise (laamb). On te donne 2 combats suspects issus de la base : dates proches, aucun athlète (NID) en commun, mais noms des deux côtés très proches — typiquement le même combat saisi deux fois sous des variantes de noms (ex. Confiance vs Fils De Falaye / Confiance Tp vs Elou Fils De Falaye).\r\n\r\nDate indicative : @date\r\n\r\nListe des 2 combats (JSON) :\r\n@combats_json\r\n\r\n---\r\nMISSION :\r\n1. Décide s'il s'agit du MÊME combat réel (same_fight=1) ou de deux combats distincts (same_fight=0).\r\n2. Si same_fight=1 :\r\n   - Choisis le combat à conserver (keep_combat_field_id = l'un des field_id_text fournis).\r\n   - Propose les noms canoniques à garder (keep_names).\r\n   - Liste les fusions éventuelles de fiches athlètes (from = variante à absorber, to = nom à conserver).\r\n3. Si same_fight=0 : fusions=[], keep_combat_field_id peut être vide.\r\n\r\nRÈGLES :\r\n- Ne fusionne que si les deux noms désignent clairement le MÊME lutteur.\r\n- Ne propose pas de fusion pour deux personnes distinctes.\r\n- keep_combat_field_id doit être EXACTEMENT l'un des field_id_text reçus.\r\n- Réponds UNIQUEMENT avec un JSON strict, sans texte avant ni après, sans markdown.\r\n\r\nFormat attendu :\r\n{\r\n  \"same_fight\": 1,\r\n  \"keep_combat_field_id\": \"exemple_field_id_text\",\r\n  \"keep_names\": [\"NomCanonique1\", \"NomCanonique2\"],\r\n  \"fusions\": [\r\n    {\"from\": \"VarianteA\", \"to\": \"NomCanonique1\"},\r\n    {\"from\": \"VarianteB\", \"to\": \"NomCanonique2\"}\r\n  ],\r\n  \"raison\": \"explication courte\"\r\n}"
