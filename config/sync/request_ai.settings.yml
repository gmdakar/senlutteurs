prompt_get_ecuries: "Voici une liste de lutteurs senegalais dont l'ecurie ou l'ecole de lutte est recherchee :\r\n@lutteurs_sans_ecurie\r\n\r\n1. RESTRICTION STRICTE DE SOURCE ET BANNISSEMENT\r\nBannissement total : Ne jamais utiliser ni consulter senlutteurs.com (source non fiable qui indique systematiquement un point d'interrogation).\r\nSources de preuve valides et exclusives :\r\n- Portail officiel CNG PERL (perl.sn) et feuilles de match.\r\n- Presse sportive specialisee senegalaise (Wiwsport, Le Soleil, Sud Quotidien, Sunu Lamb, Seneweb, Dakaractu).\r\n- Medias specialises en lutte sur YouTube et reseaux sociaux (Lutte TV, Senegal Direct, Bantamba, King Fadh, Galleu Lamb, Wassare Lamb, Albourakh Events).\r\n- Titres et descriptions de videos officielles, bannieres et affiches officielles de combat.\r\n\r\n2. STRATEGIE DE RECHERCHE DE PREUVE\r\nPour chaque lutteur de la liste, recherche la mention explicite de son ecurie :\r\n\r\nExploration des variantes du nom :\r\n- Teste la graphie exacte ainsi que les formes sans accents.\r\n- Pour les surnoms composes, teste les abreviations et variantes populaires (BB pour Bebe, Thiat pour Thiatou, Mbeur pour Mbeurou).\r\n- Si un nom comporte un suffixe (comme 2, 313, Junior), teste egalement le nom court.\r\n\r\nRequetes ciblees a executer :\r\n- nom du lutteur suivi du mot vs (dans l'arene, les titres de videos officielles indiquent l'ecurie entre parentheses).\r\n- nom du lutteur suivi du mot ecurie ou ecole.\r\n- nom du lutteur suivi du mot combat ou lutte.\r\n\r\nCritere de preuve textuelle :\r\nL'ecurie est employee uniquement si elle apparait formellement liee au lutteur dans les sources verifiees (par exemple sur un titre video ou un compte-rendu officiel).\r\n\r\n3. REGLES CRITIQUES D'INTEGRITE ET FORMATAGE\r\n- Interdiction formelle d'extrapolation geographique : Ne deduis jamais une ecurie a partir du nom du lutteur ou d'un toponyme sans confirmation explicite. L'ecurie doit etre formellement attestee.\r\n- Regle du doute : Si aucune source fiable n'atteste clairement l'ecurie de ce lutteur, attribue strictement la valeur ?.\r\n- Nettoyage des entites : Supprime systematiquement les termes redondants Ecurie ou Ecole de lutte dans la valeur finale (ecrire Lansar et non Ecurie Lansar).\r\n\r\n4. FORMAT DE SORTIE\r\nReponds uniquement avec un tableau JSON pur, valide et sans balises Markdown.\r\n\r\nFormat strict attendu :\r\n[\r\n  {\"lutteur\": \"Nom exact du lutteur\", \"ecurie\": \"Nom de l'ecurie ou ?\"}\r\n]"
prompt_get_real_dates: "Voici une liste de combats de lutte sénégalaise dont la date enregistrée dans notre base de données est fictive et fixée par défaut au 1er janvier (date de repli saisonnière) : @combats_dates_incertaines\r\n---\r\n### RESTRICTION STRICTE DES SOURCES ET BANNISSEMENT :\r\n- BANNISSEMENT TOTAL ET ABSOLU de senlutteurs.com : tu as l'interdiction formelle d'ouvrir, d'utiliser ou de citer senlutteurs.com (source non fiable qui encode aveuglément au 01/01 ou qui propage des dates de publication erronées).\r\n- Sources de vérité prioritaires : Le Soleil, Sud Quotidien, Wal Fadjri, AllAfrica, Wiwsport, P.E.R.L. (perl.sn), Lutte TV, et archives vidéo officielles.\r\n\r\n---\r\nPour CHAQUE combat de cette liste, recherche la véritable date physique du gala où il s'est déroulé.\r\n\r\n### RÈGLES CRITIQUES DE VALIDATION TEMPORELLE ET HISTORIQUE :\r\n\r\n1. GARDE-FOU TEMPOREL STRICT (FENÊTRE ABSOLUE DE ±1 AN / 18 MOIS MAXIMUM) :\r\n   - La date enregistrée au 01/01/AAAA est une date de repli qui représente la saison sportive AAAA ou la saison AAAA-1/AAAA.\r\n   - RÈGLE DU VERROU : Une date réelle trouvée n'est ACCEPTÉE QUE si son écart avec l'année de date_actuelle est STRICTEMENT INFÉRIEUR OU ÉGAL À 1 AN (±1 an).\r\n   - INTERDICTION FORMELLE D'ÉCART SUPÉRIEUR : Si la seule date que tu trouves sur le net a un écart de 2 ans ou plus par rapport à la date_actuelle (ex: date_actuelle en 2007 et combat trouvé en 2010 ou 2012), IL EST STRICTEMENT INTERDIT de retourner cette date. Tu dois OBLIGATOIREMENT renvoyer la date_actuelle telle quelle.\r\n\r\n2. DÉTECTION DES REVANCHES ET AFFRONTEMENTS MULTIPLES (RÈGLE ANTI-ÉCRASEMENT) :\r\n   - Dans l'arène sénégalaise, deux lutteurs peuvent s'affronter deux fois (ou plus) dans leur carrière : un premier combat en début de carrière (espoirs / préliminaires), puis une revanche 3 à 5 ans plus tard.\r\n   - Ne confonds JAMAIS le premier combat avec la revanche :\r\n     * Si l'ID ou la date_actuelle vise un combat précoce (ex: 2006 ou 2007) et que l'article de presse relate une revanche ou mentionne « pour la deuxième fois » à une date plus tardive (ex: 2010), cette date de revanche NE CONCERNE PAS ce combat.\r\n     * Si la date du premier combat reste non datée précisément sur le web, CONSERVE STRICTEMENT la date_actuelle d'origine pour préserver l'historique du premier duel.\r\n\r\n3. RÈGLE DU JOUR PHYSIQUE DE GALA (WEEK-ENDS VS DATE DE PARUTION DU JOURNAL) :\r\n   - Les combats officiels avec frappe se déroulent exclusivement le SAMEDI, le DIMANCHE ou les JOURS FÉRIÉS officiels.\r\n   - Piège de la presse écrite : Un article paru le lundi ou mardi ouvré relate le gala du samedi ou dimanche précédent. La date à retourner est IMPÉRATIVEMENT la date physique du week-end, jamais la date d'impression du journal.\r\n   - Exception lutte simple (mbapat) : les tournois traditionnels de quartier peuvent avoir lieu en semaine.\r\n\r\n4. MÉTHODOLOGIE DE RECHERCHE :\r\n   - Retire impérativement \"01/01\" de tes requêtes.\r\n   - Cherche : \"[lutteur1] vs [lutteur2]\" ainsi que des variantes orthographiques (ex: avec ou sans accents, diminutifs).\r\n   - Recoupe avec les bilans de saison sportive.\r\n\r\n5. GESTION DES CAS INTROUVABLES ET VRAIS 1ER JANVIER :\r\n   - Si la date exacte du week-end reste introuvable avec certitude ou dépasse le garde-fou de ±1 an : réutilise STRICTEMENT la valeur exacte de date_actuelle pour ce combat.\r\n   - \"date_confirme\": 1 UNIQUEMENT si une source de presse confirme textuellement que le combat a eu lieu physiquement un 1er janvier férié (ex: gala du Nouvel An). Sinon, mets \"date_confirme\": 0.\r\n\r\n---\r\n### FORMAT DE SORTIE STRICT (JSON PUR, SANS MARKDOWN NI TEXTE AUTOUR) :\r\n[{\"field_id_text\":\"ID du combat\",\"date_reelle\":\"YYYY-MM-DD\",\"date_confirme\":0|1}, ...]"
