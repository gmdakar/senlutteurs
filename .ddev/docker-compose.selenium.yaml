services:
  selenium:
    image: selenium/standalone-firefox:latest
    shm_size: 2g
    expose:
      - "4444"
    networks:
      ddev_default: null
    environment:
      - JAVA_OPTS=-Xmx512m
      - START_XVFB=true
      - SCREEN_WIDTH=1920
      - SCREEN_HEIGHT=1080
      - SCREEN_DEPTH=24
    labels:
      com.ddev.app-type: drupal
      com.ddev.approot: /var/www/html
      com.ddev.platform: ddev
      com.ddev.site-name: senelutte