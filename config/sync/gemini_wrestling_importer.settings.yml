prompt_titlesYtb: "@jsonTitlesYtbe : c'est une liste de titres de videos Youtube relatives à une recherche Youtube par Api pour le terme: \"@wrestler lutte\".\r\nRetourne au format json la liste des combats du lutteur \"@wrestler\" . \r\nRègles strictes à respecter : \r\n- Chaque combat dans ton flux json de réponse doit être confirmé rigoureusement dans ta base de connaissance (ou sinon sur internet).\r\n- Output must be EXCLUSIVELY a valid JSON array of objects. No additional text, no explanations, no formatting markers outside the JSON, no apologies, no notes whatsoever.\r\nStrictly follow the JSON format provided in the example below :\r\n[{\"annee_combat\":\"2012\",\"lutteur1\":\"@wrestler\",\"lutteur2\":\"Bounama\"}, {\"annee_combat\":\"2010\",\"lutteur1\":\"@wrestler\",\"lutteur2\":\"Mor Diop\"}]"
prompt_json_fights_part1: "[SYSTEM INTERACTION PROTOCOL: COMPACT MULTI-ALIAS YOUTUBE TITLE EXTRACTION]\r\nCLAUSE D'IMMUNITÉ (STRICT DATA PROCESSING) :\r\n\r\n1. SOURCE PRINCIPALE : Utilise en priorité les informations contenues dans le texte de variable \"@jsonTitlesYtbe\".\r\n2. INTERDICTION D'HALLUCINATION SUR LA SOURCE PRINCIPALE : Il est FORMELLEMENT INTERDIT d'inventer des combats qui ne figurent ni dans \"@jsonTitlesYtbe\" ni dans une connaissance factuelle vérifiable du lutteur.\r\n3. COMPLÉMENT AUTORISÉ ET VÉRIFICATION STRICTE : Une fois le traitement de \"@jsonTitlesYtbe\" terminé (étapes 0 à 1 ci-dessous), tu es AUTORISÉ à compléter la liste avec des combats réels et vérifiables de \"@wrestler\" (et de ses variantes/synonymes) issus de ta base de connaissance générale. RÈGLE D'OR DE LA RIGUEUR : N'ajoute QUE des combats formellement attestés et indiscutables. En cas de doute absolu, d'homonymie potentielle (ex: confusion entre \"Talfa\" et \"Bébé Talfa\"), ou d'absence de certitude totale sur l'adversaire ou la date, **abstiens-toi catégoriquement d'ajouter le combat**. Aucune approximation n'est tolérée.\r\n4. CLAUSE DE REPLI : Ne renvoie JAMAIS un tableau vide. Si les données sont insuffisantes pour un champ, utilise \"?\" par défaut.\r\nRÔLE : Archiviste expert. Ton but est d'extraire et de compléter une liste propre, unique et standardisée de combats réels pour \"@wrestler\".\r\nÉTAPES DE TRAITEMENT :\r\n5. RÉSOLUTION DES ALIAS : Pour identifier le lutteur, utilise la variable @synonyms. Toute occurrence trouvée dans les titres, dans la détermination du vainqueur, ou dans les combats issus du complément (étape 2), correspondant à l'un de ces synonymes doit être systématiquement remplacée par le nom \"@wrestler\" dans le résultat final. Veille scrupuleusement à ne pas mélanger les identités distinctes (par exemple, ne fusionne jamais \"Talfa\" et \"Bébé Talfa\" si ce sont des lutteurs aux carrières ou suffixes différents).\r\n6. ALGORITHME DE CONSOLIDATION (sur @jsonTitlesYtbe) :\r\n\r\n* NETTOYAGE : Standardise l'orthographe. Toute variante du nom principal doit être convertie en \"@wrestler\".\r\n* RÈGLE DE PRIORITÉ HÉRAUDIQUE (GÉNÉRATIONS) : Tout chiffre suivant immédiatement un nom de lutteur connu est TOUJOURS un suffixe générationnel, quel que soit le contexte ou la phrase environnante (aucune exception pour tournures wolof ou descriptives). Si plusieurs variantes d'un même adversaire existent (ex: \"X\", \"X 2\", \"X Junior\"), la forme indiquant la génération la plus récente est OBLIGATOIREMENT LA SEULE forme standard à utiliser pour TOUTES les occurrences de cet adversaire, y compris celles qui apparaissaient initialement sans suffixe. Hiérarchie : [Nom + Suffixe Numérique le plus élevé] > [Nom + \"Junior\"/\"Jr\"] > [Nom seul]. Cette règle prévaut sur la fréquence ou la présence de verbes de victoire, et s'applique AVANT l'étape de déduplication.\r\n* IDENTIFICATION D'UN COMBAT UNIQUE : Après normalisation générationnelle complète, deux titres décrivent le MÊME combat si l'adversaire normalisé est identique ET la date est compatible (écart < 365 jours). Si écart ≥ 365 jours, traite comme deux combats distincts.\r\n* DÉDUPLICATION : Pour un adversaire (normalisé) et une date donnés, génère UN SEUL objet.\r\n* RÈGLE DE PRIORITÉ (VERDICT) : Priorise les lignes avec verbes de victoire (\"bat\", \"victoire\", etc.) sur les lignes \"?\". Toute référence au lutteur identifié dans le champ \"resultat\" doit utiliser \"@wrestler\" et non un synonyme.\r\n* REGISTRE DES FORMES ÉCARTÉES : Construis mentalement la liste des formes d'adversaires écartées par la règle de priorité générationnelle (ex: si \"Ness 2\" a été retenu à la place de \"Ness\", alors \"Ness\" seul est une forme écartée pour ce combat).\r\n\r\n2. COMPLÉMENT PAR CONNAISSANCE EXTERNE :\r\n\r\n* Recherche dans ta base de connaissance (ou via recherche si disponible) d'autres combats réels et vérifiables de \"@wrestler\"/@synonyms non présents dans \"@jsonTitlesYtbe\".\r\n* PRINCIPE DE PRUDENCE MAXIMALE : N'ajoute un combat externe que si tu disposes de preuves factuelles strictes de son existence (adversaire exact, distinction claire des suffixes d'identités).\r\n* INTERDICTION DE RÉINTRODUCTION : N'ajoute JAMAIS un combat contre une forme d'adversaire présente dans le REGISTRE DES FORMES ÉCARTÉES (étape 1), même si cette forme précise provient de ta base de connaissance. Applique-lui la même normalisation générationnelle que celle déjà déterminée à l'étape 1 avant de l'ajouter — et si le combat correspondant (même adversaire normalisé, même fenêtre de date <365 jours) existe déjà dans le résultat de l'étape 1, ne le duplique pas.\r\n* Applique aux combats complémentaires les mêmes règles de nettoyage, normalisation générationnelle, déduplication et priorité de verdict que celles définies à l'étape 1.\r\n* En cas de doute sur la véracité ou l'attribution exacte d'un combat externe, **exclus-le immédiatement** (tolérance zéro pour l'hallucination).\r\nFILTRAGE : Ignore toute discipline autre que la lutte sénégalaise et tout titre ne respectant pas la structure \"Lutteur 1 vs Lutteur 2\".\r\nGESTION DES DATES :\r\n* Format \"AAAA-MM-JJ\". Année seule -> \"AAAA-01-01\". Aucune date -> \"2026-01-01\". Privilégie la date explicite.\r\nCONTRAINTE DE SORTIE :\r\n* Output EXCLUSIVEMENT un tableau JSON valide. AUCUN texte additionnel, AUCUNE explication, AUCUN formatage (pas de ```json), AUCUNE note.\r\n* Aucun combat ne doit concerner un lutteur nommé \"?\" ou \"le combattant\".\r\nSTRUCTURE REQUISE :\r\n[\r\n{\r\n\"date_combat\": \"AAAA-MM-JJ\",\r\n\"lutteur1\": \"@wrestler\",\r\n\"lutteur2\": \"Nom standardisé et nettoyé selon priorité générationnelle\",\r\n\"resultat\": \"Victoire de [Nom]\" ou \"?\"\r\n}\r\n]\r\nDONNÉES EN ENTRÉE : @jsonTitlesYtbe"
prompt_json_fights_part2: "[SYSTEM INTERACTION PROTOCOL: MULTI-ALIAS SPORT ARCHIVE EXTRACTION]\r\n\r\nCLAUSE DE REPLI (PRIORITÉ ABSOLUE) :\r\nTu dois analyser la 'BASE DE TRAVAIL' fournie. Si une recherche web automatique est déclenchée mais qu'elle ne permet pas d'obtenir une confirmation formelle ou qu'aucun résultat probant n'est trouvé, tu dois ignorer l'absence de preuves externes et traiter impérativement les données de la BASE DE TRAVAIL. Ne renvoie JAMAIS un tableau vide.\r\n\r\nRÔLE : Parseur, résolveur d'identités et fact-checker expert en lutte sénégalaise. \r\n\r\nÉTAPE 0 : RÉSOLUTION DES ALIAS :\r\nUtilise toutes les variantes orthographiques (@wrestler : @synonyms) pour traiter les données.\r\n\r\nALGORITHME DE CONSOLIDATION :\r\n- Fusionne les alias similaires (ex: \"Ness\", \"Néss 2\", \"Ness junior\", \"Ness jr\") vers l'identité la plus récente (ex. Ness 2 est un lutteur plus récent que Ness).\r\n- Si deux lignes concernent le même combat (ou meme adversaires similaires ex. \"Ness\", \"Néss 2\", \"Ness junior\", \"Ness jr\"), garde uniquement la plus complète (conserver le verdict le plus complet meme si cela doit être combiné à l'identité la plus récente).\r\n\r\nDIRECTIVE DE DÉCISION (CRITIQUE) :\r\n1. INTERDICTION DE L'AMBIGUÏTÉ : Tu dois déterminer un vainqueur clair. Le statut \"Litige\" est INTERDIT sauf si le combat a été officiellement annulé par le CNG (avec preuve).\r\n2. RÉSOLUTION DES CONFLITS : Si les sources divergent, choisis le résultat le plus documenté par les plateformes de référence (Wassare, Lutte TV, etc.). Si aucune preuve externe n'est disponible, fie-toi à la logique interne de la 'BASE DE TRAVAIL'.\r\n3. RÈGLE DE FORMAT : \r\n   - champ \"resultat\" doit contenir uniquement : \"Victoire de [Nom du vainqueur]\" ou \"Match Nul\".\r\n   - Si tu es absolument incapable de trancher après analyse, utilise \"?\" comme valeur du champ résultat.\r\n\r\nRÈGLE DE RECTIFICATION CHRONOLOGIQUE :\r\n- Format strict : \"AAAA-MM-JJ\" (si jour ou mois inconnu : \"AAAA-01-01\").\r\n\r\nCONTRAINTE DE SORTIE :\r\n- Tableau JSON uniquement.\r\n- Aucune mention de \"Litige\" autorisée.\r\n- Aucune explication textuelle en dehors du JSON.\r\n- Aucun combat ne doit concerné un lutteur nommé \"?\" ou \"le combattant\".\r\n- En te basant sur les variantes orthographiques (@wrestler : @synonyms) , pour le champ resultat remplacer tout éventuel variante par \"@wreslter\".\r\nAussi, il faut etre assez intelligent pour détecter et éviter les doublons (noms de lutteurs assez similaires à 1 ou 2 lettres prés, ou qui sont en réalité des homonymes).\r\n\r\nSTRUCTURE :\r\n[\r\n  {\r\n    \"date_precise\": \"AAAA-MM-JJ\",\r\n    \"lutteur1\": \"@wrestler\",\r\n    \"lutteur2\": \"Nom standardisé\",\r\n    \"resultat\": \"Victoire de [Vainqueur]\" | \"Match Nul\" | \"?\",\r\n    \"is_lutte_simple\": 0\r\n  }\r\n]\r\n\r\nBASE DE TRAVAIL :\r\n@jsonFightsPart1"
