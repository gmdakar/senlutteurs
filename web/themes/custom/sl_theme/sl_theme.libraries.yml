global-styling:
  version: 1.7.6
  js:
    js/global.js: {}
  css:
    component:
      css/style.css: {}
      css/colors.css: {}
  dependencies:
    - core/jquery
    - core/drupal
    - core/drupalSettings
    - core/once
    - sl_theme/bootstrap # Charge Bootstrap AVANT le JS global

# Nouvelle librairie EXCLUSIVE à la page d'accueil
front-styling:
  version: 1.7.6
  js:
    js/front.js: {}
  css:
    component:
      css/front.css: {}

# Nouvelle librairie EXCLUSIVE aux pages intérieures
interior-styling:
  version: 1.7.6
  js:
    js/interior.js: {}
  css:
    component:
      css/interior.css: {}

bootstrap:
  version: 5.3.8
  remote: https://github.com/twbs/bootstrap
  license:
    name: MIT
    url: https://github.com/twbs/bootstrap/blob/main/LICENSE
    gpl-compatible: true
  js:
    /libraries/bootstrap/dist/js/bootstrap.min.js: { weight: -20 }
  css:
    component:
      /libraries/bootstrap/dist/css/bootstrap.min.css: {}
  dependencies:
    - core/popperjs

color.preview:
  version: VERSION
  css:
    theme:
      color/preview.css: {}
  js:
    color/preview.js: {}
  dependencies:
    - color/drupal.color