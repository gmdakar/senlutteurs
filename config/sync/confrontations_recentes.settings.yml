prompt: "__debug__\r\nRESTRICTION STRICTE DES SOURCES ET BANNISSEMENT TOTAL :\r\n- BANNISSEMENT ABSOLU de senlutteurs.com : tu as l'interdiction formelle d'ouvrir, d'utiliser ou d'extraire des données du site senlutteurs.com (source bannie pour erreurs et artefacts).\r\n- Sources hautement prioritaires autorisées : groupes et pages Facebook spécialisés en lutte sénégalaise (+commentaires), Instagram, X, comptes-rendus officiels du CNG (perl.sn), et les sites de référence fiables : Wiwsport, Seneweb, Le Soleil, Sud Quotidien, Lutte TV.\r\n\r\nCherche la liste exhaustive des combats (lutte sénégalaise) au Sénégal qui ont déjà eu lieu il y a 10 jours (la date de chaque combat doit donc être expirée à ce jour). Fournir aussi le nom d'écurie de chaque lutteur concerné et le verdict (n'invente rien) d'après les sources. NB: Il me semble qu'il y en a plus de 15 à confirmer.\r\n\r\nComplète cette liste en allant aussi sur YouTube pour trouver la liste de combats de lutte au Sénégal qui ont déjà eu lieu (la date de chaque combat doit donc être expirée à ce jour) et ont été publiés sur YouTube il y a moins de 10 jours (bien faire attention à la date de tenue du combat physique par rapport à la date de publication). Format JSON simple. Fournir le nom d'écurie de chaque lutteur et le verdict de chacun des combats d'après les sources au-delà de la vidéo (ou en exploitant les commentaires des vidéos du combat ; dans le doute, regarde les commentaires et si pas de verdict unanime, choisis la tendance forte en renseignant le champ exceptionnel \"tendance\" avec le nom du lutteur). Liste exhaustive, ne pas filtrer sur le nombre de vues ou la notoriété.\r\n\r\nMaintenant, comme résultat unique affiché : donne en agrégeant intelligemment (pas de doublons si deux combats n'ont pour différence qu'une variante de nom, prends le nom officiel) la liste de ces combats au format JSON simple. \r\nChamps attendus : \r\n- \"date_jour\" : (1 seul champ avec la date du jour d'extraction), \r\n- \"combats_lutte_recents\" : tableau d'objets incluant :\r\n  * \"date_precise\" : date réelle du combat (format YYYY-MM-DD),\r\n  * \"source\" : nom de la source d'époque,\r\n  * \"is_lutte_simple\" : 1 si lutte traditionnelle sans frappe / mbapatte, 0 si lutte avec frappe sous licence,\r\n  * \"lutteur1\" : \"Nom / Ecurie\" (séparateur '/', sans le mot 'Ecurie'),\r\n  * \"lutteur2\" : \"Nom / Ecurie\",\r\n  * \"resultat\" : nom du vainqueur seul (sans écurie) ou \"?\" si inconnu,\r\n  * \"face2face\" : lien YouTube valide du face-à-face verbal (ou chaîne vide),\r\n  * \"video_combat\" : lien YouTube valide de la chute physique (ou chaîne vide).\r\n\r\nToutefois dans le flux JSON, aucun lien YouTube ne doit contenir le terme \"ID_from_Lutte_Motivation\" (dans ce cas, laisser la chaîne vide \"\").\r\n\r\nNB OBLIGATOIRES :\r\n1) Noms des 2 lutteurs OBLIGATOIRES (jamais de \"?\"). En cas de verdict indécis mais penchant fortement selon les commentaires, renseigne la même valeur dans \"resultat\" et \"tendance\".\r\n2) Noms précis obligatoires : ne tronque jamais les suffixes générationnels (ex: \"Tapha Tine 2\" et non \"Tapha Tine\" ; \"Fils De Diop 2\" et non \"Fils De Diop\"). Dates au format strict php Y-m-d. RAPPEL : BANNISSEMENT TOTAL de senlutteurs.com.\r\n3) Désambiguïsation obligatoire des homonymes :\r\n   - Pour \"Pape Mbaye\" : précise obligatoirement parmi \"Pape Mbaye 2 (fadam)\", \"Pape Mbaye 2 (keur massar)\" ou \"Pape Mbaye Hersent\".\r\n   - Pour \"Boy Diop\" ou \"Diop 2\" : précise parmi \"Boy diop 1\", \"Boy diop 2\" ou \"Boy diop (mbollo)\".\r\n   - Pour \"Alboury\" : précise parmi \"Alboury (Kay Bakh)\", \"Alboury 2\" ou \"Alboury\".\r\n4) Liens YouTube : uniquement des URLs réelles et valides (pas de vidéos supprimées, pas de faux liens \"watch?v=ID_...\").\r\n5) QUALIFICATION DE LA LUTTE SIMPLE (is_lutte_simple = 1) :\r\n   - LIEUX 100 % SANS FRAPPE : Tout combat s'étant déroulé au TERRAIN GALGUI (Khar Yalla / Grand Yoff), à l'ARÈNE ADRIEN SENGHOR, à Ndayane, Djilor, Joal-Fadiouth, Diofior, Bassoul, Palmarin ou dans les îles du Saloum est STRICTEMENT de la LUTTE SIMPLE (is_lutte_simple = 1).\r\n   - TOURNOIS : Tout combat issu du tournoi de la CEDEAO (TOLAC), du Drapeau du Chef de l'État, ou d'un tournoi avec \"mise de X millions\", \"quarts de finale\", \"demi-finales\" ou \"poules\" (même organisé à l'Arène nationale) est de la LUTTE SIMPLE (is_lutte_simple = 1).\r\n\r\nIMPORTANT : Retourne UNIQUEMENT un JSON valide débutant par { et finissant par } ; AUCUN texte avant ou après ; PAS de balises ```json ; Virgules et guillemets stricts."
