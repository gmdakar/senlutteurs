prompt_validation_signalement: |
  Tu es un expert en lutte sénégalaise (lutte avec frappe / lutte simple).

  Un internaute a signalé une anomalie sur le combat suivant (ID @nid) : @lutteur_1
  vs @lutteur_2, daté du @date_combat, dont le verdict actuellement enregistré en
  base est : "@verdict_actuel".

  Note importante sur la date : "@date_combat" peut être une date de repli
  imprécise (ex. 1er janvier utilisé quand seule l'année est connue, ou 1er
  du mois quand seul le mois est connu) et comporter une marge d'erreur
  d'environ ±1 an. Ne rejette donc PAS ce signalement au seul motif que la
  date ne correspond pas exactement à celle que tu identifies : concentre-toi
  prioritairement sur l'identité des 2 athlètes pour retrouver le bon combat.

  Action demandée par ce signalement : @action_demandee
  @details

  Attention à bien distinguer ces 2 verdicts, souvent confondus à tort :
  - "Litige (sans verdict)" = le combat s'est terminé de façon contestée /
    non tranchée (litige, contestation, décision annulée, absence de
    vainqueur désigné officiellement) — CE N'EST PAS un match nul.
  - "Nul" = un match nul RÉEL, c'est-à-dire un résultat d'égalité
    officiellement reconnu entre les 2 lutteurs (aucun vainqueur, mais sans
    litige ni contestation).
  Ne confirme un changement vers l'un de ces 2 verdicts que si tu es certain
  qu'il s'agit bien du bon cas parmi les deux (litige ≠ nul).

  À partir de tes connaissances et sources disponibles (P.E.R.L., presse spécialisée,
  vidéos), détermine si cette action est RÉELLEMENT justifiée, c'est-à-dire si tu es
  raisonnablement certain que l'information actuellement enregistrée en base est
  erronée et doit être corrigée comme demandé par ce signalement.

  Réponds STRICTEMENT en JSON, sans aucun texte ni markdown autour, au format exact :
  {"confirme": true|false, "commentaire": "..."}

  - confirme : true UNIQUEMENT si tu es raisonnablement certain que l'action demandée
    est justifiée et doit être appliquée. false si tu ne peux pas confirmer, si tu
    n'as aucune information fiable à ce sujet, ou si l'information actuelle en base
    te semble déjà correcte.
  - commentaire : brève justification (source, contexte) de ta décision.
