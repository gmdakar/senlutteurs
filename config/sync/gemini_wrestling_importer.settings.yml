promptFindVideos: "__ignore__\r\n1) Quel est l'autre pseudo de combat du lutteur senegalais \"@wrestler1\". Les 2 doivent partagés au moins 1 mot commun. \r\n2) Quel est l'autre pseudo de combat du lutteur senegalais \"@wrestler2\". Les 2 doivent partagés au moins 1 mot commun. \r\n3) pour l'item {lutteur1:@wrestler1,lutteur2:@wrestler2}, cherche moi la video youtube du face 2 face et aussi la video youtube du combat sous format json (en completant juste le flux ci-dessus avec les champs face2face et video_combat). La date de la video doit etre assez proche de la date @date au format Y-m-d mais à + ou - 1 an prés. Si le titre de la video que tu as vu sur Youtube ne correspond  pas à 80% aux noms des 2 lutteurs alors ignore la video. Aussi test si la video est toujours disponible (obligatoire et pas de 404 error response). Si les résultats suggèrent que les 2 lutteurs ne se sont pas affrontés directement alors ignore les videos et arrete. sans commentaire. et prends ton temps.\r\nRetourne moi uniquement la response du json modifié."
prompt_diff: "[SYSTEM INTERACTION PROTOCOL: MULTI-ALIAS SPORT ARCHIVE EXTRACTION]\r\n\r\nCLAUSE DE REPLI (PRIORITÉ ABSOLUE) :\r\nTu dois analyser la 'BASE DE TRAVAIL' ou l'image fournie. Si une recherche web automatique est déclenchée mais qu'elle ne permet pas d'obtenir une confirmation formelle ou qu'aucun résultat probant n'est trouvé, tu dois ignorer l'absence de preuves externes et traiter impérativement les données fournies. Ne renvoie JAMAIS un tableau vide.\r\n\r\nRÔLE : Ingénieur de données et archiviste expert en sport. Ton but est de nettoyer des bases de données brutes, de résoudre les alias d'athlètes et de convertir du texte ou des captures d'écran en données sportives structurées et vérifiées.\r\n\r\nTA MISSION :\r\nPour CHAQUE combat listé dans la BASE DE TRAVAIL (ou l'image), effectue une recherche web exhaustive si nécessaire, résous les identités réelles des athlètes, applique le protocole de déduplication strict et génère un tableau JSON précis. Si une information est introuvable après recherche, utilise exclusivement la valeur \"?\".\r\n\r\nRÈGLES D'OR DE TRAITEMENT :\r\n\r\nÉTAPE 0 : RÉSOLUTION DES ALIAS ET NOMS OFFICIELS\r\nAvant toute analyse, identifie \"@wrestler\" et son adversaire. Recherche toutes les variantes orthographiques, pseudonymes ou noms de scène couramment utilisés.\r\n\r\n1. CONSOLIDATION DES ADVERSAIRES :\r\nConsolide les noms vers leur forme officielle et standardisée (Ex: \"Nom bou Surnom\" -> \"Nom Officiel\").\r\n- HOMONYMES / GÉNÉRATIONS : Si deux lutteurs distincts partagent le même nom de base (ex: \"Ness\" et \"Ness 2\"), traite-les comme des entités séparées. Attention : valide rigoureusement si \"@wrestler\" est lui-même concerné par une fusion d'alias.\r\n\r\n2. PROTOCOLE DE DÉDUPLICATION STRICT (RÈGLE DE LA DATE LA PLUS ANCIENNE) :\r\nAprès extraction, inspecte rigoureusement la liste pour détecter les doublons (combats identiques ou variantes d'un même affrontement). En cas de doublon avec des dates différentes, applique cet arbitrage absolu :\r\n- RÈGLE DE BASE : Conserve UNIQUEMENT la ligne contenant la date la plus ANCIENNE.\r\n- EXCEPTION DU 1ER JANVIER : Si l'une des dates est un 1er janvier factice (ex: \"2024-01-01\") et que l'autre date est précise (ex: \"2024-05-12\" même plus récente), conserve la date précise.\r\n- DOUBLONS DE 1ER JANVIER : Si tous les doublons identifiés sont datés d'un 1er janvier (ex: \"2023-01-01\" vs \"2025-01-01\"), n'en conserve qu'un seul : celui qui porte la date la plus ancienne (dans cet exemple, \"2023-01-01\").\r\n- Dans tous les cas, ne conserve qu'un SEUL combat parmi les doublons identifiés.\r\n\r\n3. PROTOCOLE D'EXTRACTION DE VERDICT :\r\nDétermine le résultat réel sur le terrain :\r\n- \"Victoire de @wrestler\" : Domination ou chute de l'adversaire en faveur de @wrestler.\r\n- \"Défaite de @wrestler\" : Chute ou défaite de @wrestler.\r\n- \"Nul\" : Si le combat s'est soldé par un match nul / égalité.\r\n- \"?\" : En cas de doute ou d'absence d'information fiable.\r\n\r\n4. INSTRUCTIONS CHRONOLOGIQUES (Format Strict) :\r\nConvertis toutes les dates au format standardisé international :\r\n- Format : \"AAAA-MM-JJ\".\r\n- Si seule l'année est connue : \"AAAA-01-01\". Aucun champ ne doit rester vide ou non structuré.\r\n\r\nFORMAT DE SORTIE : \r\nUniquement un tableau JSON valide. Aucun texte introductif, aucune explication, aucune conclusion. Aucun combat ne doit concerner un lutteur nommé \"?\" ou \"le combattant\".\r\nIMPORTANT : Tous les combats dans la réponse doivent concerner OBLIGATOIREMENT le lutteur \"@wrestler\".\r\n- Supprime tout combat dont tu es absolument certain qu'il n'a jamais eu lieu.\r\n- Remplace toute variante orthographique de \"@wrestler\" par son nom standardisé exact dans les champs \"lutteur1\", \"lutteur2\" et \"resultat\".\r\n\r\nSTRUCTURE :\r\n[\r\n  {\r\n    \"date_precise\": \"AAAA-MM-JJ\",\r\n    \"lutteur1\": \"@wrestler\",\r\n    \"lutteur2\": \"Nom standardisé de l'adversaire\",\r\n    \"resultat\": \"Victoire de @wrestler\" | \"Défaite de @wrestler\" | \"Nul\" | \"?\"\r\n  }\r\n]\r\n\r\nBASE DE TRAVAIL / IMAGE :\r\n[@jsonFightsPart2]"
