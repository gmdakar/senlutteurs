prompt_confirm_wrestlers: "Tu dois valider un combat de lutte sénégalaise À VENIR avant insertion en base.\r\nLutteur 1 (nom brut fourni) : @wrestler1 Écurie du Lutteur 1 fournie en entrée\r\n(si connue) : @ecurie1 Lutteur 2 (nom brut fourni) : @wrestler2 Écurie du\r\nLutteur 2 fournie en entrée (si connue) : @ecurie2 Date prévue du combat : @date\r\nHistorique des 2 derniers combats connus du Lutteur 1 : @historique1 Historique\r\ndes 2 derniers combats connus du Lutteur 2 : @historique2 Variantes de noms\r\nproches déjà présentes en base pour le Lutteur 1 : @suggestions1 Variantes de\r\nnoms proches déjà présentes en base pour le Lutteur 2 : @suggestions2 Dans ces\r\nsuggestions, le nom entre guillemets est le nom exact du lutteur déjà en base ;\r\nla mention \"de l'écurie X\" qui peut suivre est une simple information indicative\r\nsur son écurie, pas une partie du nom. L'écurie fournie en entrée pour chaque\r\nlutteur (si non vide) est une information fiable en provenance de la source\r\nd'origine : utilise-la en priorité pour identifier le bon lutteur parmi les\r\nsuggestions et lever une éventuelle homonymie.\r\n\r\nTraite la correction de chaque nom en 3 étapes indépendantes et cumulables :\r\n\r\nÉTAPE A — Nom pollué par du texte parasite : le nom brut fourni peut provenir\r\nd'une extraction automatique (titre YouTube, article...) qui a parfois collé au\r\nvrai nom du lutteur des mots qui n'en font PAS partie (nom de lieu, nom de\r\nl'autre lutteur, mention d'écurie, terme promotionnel, slogan...), sans séparateur\r\nclair. Si tu identifies que le nom réel du lutteur (celui que tu connais, ou\r\ncelui qui correspond à une suggestion) est plus court que le nom brut fourni et\r\nque les mots en trop ne sont pas un surnom ou un numéro de génération légitime,\r\ncorrige le nom en ne gardant que le vrai nom du lutteur :\r\n* Exemple 1 : Si le lutteur réel s'appelle \"Baleine\" et que le nom brut fourni est \"Baleine Gueiawaye\", corrige en \"Baleine\" (\"Gueiawaye\" n'étant pas une variante de son nom mais un mot parasite collé lors de l'extraction).\r\n* Exemple 2 : Si le lutteur réel s'appelle \"R5\" et que le nom brut fourni est \"R5 Dieul Bou Reuy\" (ou similaire), corrige impérativement en \"R5\" car \"Dieul Bou Reuy\" (expression wolof signifiant \"la grande prise\") est un slogan promotionnel collé lors de l'extraction d'un titre de vidéo, et n'a jamais fait partie de son nom officiel.\r\nGarde à l'esprit qu'un suffixe de distinction ou de génération comme \"Bou Ndaw\", \"2\", \"Junior\" ou \"Bou Sokh\" n'est\r\nJAMAIS un texte parasite et ne doit sous aucun prétexte être tronqué. Par\r\nexemple, \"Baleine\" et \"Baleine Bou Ndaw\" sont deux lutteurs distincts d'écuries\r\ndifférentes ; l'un n'est pas la version simplifiée ou abrégée de l'autre.\r\n\r\nÉTAPE B — Orthographe : indépendamment de l'étape A, vérifie si le nom (une fois\r\nnettoyé) est mal orthographié au regard de l'orthographe officielle utilisée\r\ndans les communiqués du CNG (Comité National de Gestion de la Lutte au Sénégal)\r\net par la presse sportive sénégalaise. Si oui, corrige l'orthographe (ex:\r\n\"Fraanc\" → \"Franc\", \"Niakh diarigniou\" → \"Niakh Diarignou\") — y compris si cette\r\northographe erronée est déjà celle utilisée dans une suggestion en base : ne\r\nrecopie jamais une coquille existante en base.\r\n\r\nÉTAPE C — Identité/homonymie : détermine ensuite, en te basant sur ce que tu\r\nsais de ces lutteurs (actualité de la lutte sénégalaise) et sur les suggestions,\r\nsi le lutteur (nom nettoyé et orthographe corrigée) correspond exactement (même\r\nécurie, même génération) à l'une des suggestions proposées.\r\n\r\n**CONTRÔLE STRICT DE L'ÉCURIE ET DES SURNOMS :**\r\n1. Compare systématiquement l'écurie du lutteur (fournie en entrée ou connue de toi) avec celle associée aux suggestions de la base. Si le nom nettoyé est identique à l'une des suggestions (ex: \"Pokola\") mais que leurs écuries respectives sont différentes (ex: écurie d'entrée \"Fass Mbao\" alors que la suggestion \"Pokola\" correspond à Pokola de Falaye Baldé), ne considère PAS qu'il s'agit du même lutteur. Traite-le comme un homonyme différent et applique la règle de la parenthèse distinctive (second point ci-dessous).\r\n2. EXCEPTION ESSENTIELLE : Si le nom nettoyé correspond exactement à une suggestion mais que cette suggestion n'a AUCUNE écurie renseignée dans la liste (ou si sa valeur d'écurie est inconnue, \"?\" ou absente de la mention \"de l'écurie X\"), ne crée JAMAIS de parenthèse distinctive. Considère par défaut qu'il s'agit du bon lutteur déjà présent en base dont l'écurie n'était pas encore enregistrée. Dans ce cas, complète ou mets à jour son nom sous la forme \"Nom/Ecurie\" (ex: \"Yakhi Bambilor/Thiaroye-sur-Mer\") pour renseigner l'écurie manquante.\r\n3. CAS DES SURNOMS ET NOMS FAMILIAUX (\"Fils de\", \"Thiat\", \"Thiatou\", \"Domou\") : Si le nom brut fourni correspond au surnom d'un lutteur ou au surnom historique de son parent (ex: \"Fils Songué\"), privilégie systématiquement le nom officiel CNG basé sur le patronyme officiel du parent (ex: \"Fils De Sow Gueye\") pour correspondre à la suggestion officielle de la base.\r\n\r\n  - Si oui (nom et écurie/génération concordent parfaitement avec une suggestion) : garde uniquement les corrections des étapes A et B (s'il y en a),\r\n    SANS ajouter de parenthèse — même si d'autres suggestions homonymes existent\r\n    par ailleurs dans la liste. Ne recrée jamais de parenthèse si la suggestion existante désigne déjà ce lutteur.\r\n  - Si le nom correspond à un nom présent dans les suggestions mais qu'il s'agit\r\n    en réalité d'un lutteur différent (pas la même écurie, ni la même\r\n    génération) de TOUTES les suggestions proposées : ajoute une parenthèse\r\n    contenant le nom de son écurie, de sa ville/origine (au plus court) ou de\r\n    son surnom distinctif, pour éviter toute confusion ou fusion de profils en\r\n    base. N'inclus jamais les termes \"écurie\", \"école de lutte\" ou \"écurie de\r\n    lutte\" dans cette parenthèse (ex: \"Alboury (Pout)\", \"Pokola (Fass Mbao)\", \"Alboury (borom)\").\r\n    **ATTENTION CRUCIALE : Tu ne dois ajouter une parenthèse distinctive que si le nom de base nettoyé est DÉJÀ présent dans la liste des suggestions fournies de la base de données. S'il n'existe aucune suggestion portant ce nom exact en base, n'ajoute JAMAIS de parenthèse (ex: ne propose pas \"Laye Pythagore 2 (Ndagou Gueye)\" si \"Laye Pythagore 2\" ne figure pas dans les suggestions de la base ; écris simplement \"Laye Pythagore 2\").**\r\n    Dans ce cas précis, n'applique PAS l'étape B par-dessus : la parenthèse\r\n    suffit à distinguer le lutteur, ne cherche pas en plus à corriger\r\n    l'orthographe officielle CNG de son nom.\r\n  - Si le nom ne correspond à AUCUNE suggestion et n'est l'homonyme d'aucune\r\n    d'elles : garde uniquement les corrections des étapes A et B, sans\r\n    parenthèse.\r\n\r\nAttention : ne présume JAMAIS qu'un nom désigne automatiquement le lutteur le\r\nplus connu/médiatisé portant ce nom. De même, ne suppose jamais qu'un nom de\r\nlutteur plus court est l'abréviation ou la saisie incomplète d'un nom plus long\r\n(par exemple, \"Baleine\" ne doit pas être assimilé ou \"corrigé\" en \"Baleine Bou\r\nNdaw\" car ils ont deux identités et deux écuries distinctes). Vérifie l'identité\r\nréelle du lutteur au vu du contexte précis du combat (adversaire, date, écurie\r\nfournie en entrée, historique) avant d'attribuer une écurie ou une parenthèse.\r\nSi tu n'es pas raisonnablement certain de l'identité exacte du lutteur (par\r\nexemple si plusieurs lutteurs homonymes sont plausibles et que rien ne permet de\r\ntrancher avec certitude), N'ajoute PAS de parenthèse et N'invente PAS d'écurie :\r\nconserve le nom (nettoyé/orthographe corrigée si besoin) et signale ton\r\nincertitude dans \"commentaire\".\r\n\r\nException : si tu ne retrouves pas le lutteur parmi les suggestions simplement\r\nparce qu'il a changé d'écurie depuis (le nom correspond bien au même lutteur,\r\nseule son écurie a évolué), n'ajoute PAS de parenthèse : garde le nom du lutteur\r\n(nettoyé/orthographe corrigée si besoin).\r\n\r\nComplétion d'écurie : \r\n1. Si l'écurie d'un lutteur n'était PAS fournie en entrée (mention \"(non fournie)\" ci-dessus) et que tu la connais de manière fiable, ajoute-la sous la forme \"Nom/Ecurie\" (ex: \"Baleine/Mor Fadam\").\r\n2. Si le lutteur correspond à une suggestion dont l'écurie n'était pas renseignée en base (pas de mention \"de l'écurie X\" dans la suggestion), ajoute impérativement l'écurie après le slash sous la forme \"Nom/Ecurie\" (ex: \"Yakhi Bambilor/Thiaroye-sur-Mer\"), même si l'écurie était fournie en entrée, afin d'enregistrer l'information manquante.\r\nN'inclus JAMAIS les termes \"écurie\", \"école de lutte\" ou \"écurie de lutte\" après le slash (ex: \"Baleine/Mor Fadam\", pas \"Baleine/Ecurie Mor Fadam\"). En dehors de ces cas, ou si l'écurie du lutteur est déjà connue et correspond à celle de la suggestion, ne mets aucun slash dans le nom.\r\n\r\nRéponds UNIQUEMENT en JSON strict, sans markdown :\r\n{\"lutteur1\":\"...\",\"lutteur2\":\"...\",\"date_precise\":\"...\",\"correspond_aux_profils\":true,\"commentaire\":\"...\"}"
prompt_ai_doublons_avenir: "Tu dois résoudre un groupe de combats de lutte sénégalaise À VENIR suspects de doublon.\r\n\r\nRÈGLE MÉTIER ABSOLUE : un lutteur ne peut pas avoir deux combats à venir distincts le même jour. Si plusieurs affiches partagent la même date et au moins un protagoniste, il s'agit du MÊME combat réel sous des variantes de noms d'adversaire (ou d'une erreur de source). Tu dois en conserver UN seul et supprimer les autres.\r\n\r\nLutteur pivot (présent dans plusieurs affiches) : @pivot\r\nÉcurie du pivot : @ecurie_pivot\r\nNb de combats connus du pivot en base : @nb_combats_pivot\r\nDate du groupe : @date\r\n\r\nCombats candidats (JSON) : @combats_json\r\nNb de combats en base par adversaire (contexte informatif, pas une règle de décision) : @nb_combats_adversaires\r\nHistorique récent par adversaire : @historique_adversaires\r\nSuggestions de noms proches déjà en base par adversaire : @suggestions_adversaires\r\n\r\nPour chaque combat fourni, renvoie un verdict avec le MÊME field_id_text.\r\ndelete=0 → conserver ; delete=1 → supprimer.\r\nIl doit rester AU MOINS un delete=0.\r\nChoisis la variante d'adversaire la plus fiable au vu du contexte (profil connu, historique, suggestions en base) — ne te base PAS uniquement sur le nombre de combats.\r\n\r\nRéponds UNIQUEMENT en JSON strict, sans markdown :\r\n{\"verdicts\":[{\"field_id_text\":\"...\",\"delete\":0,\"raison\":\"...\"},{\"field_id_text\":\"...\",\"delete\":1,\"raison\":\"...\"}],\"nom_canonique_adversaire\":\"...\",\"commentaire\":\"...\"}"
