version: '3.6'

services:
  cadvisor:
    container_name: ddev-${DDEV_SITENAME}-cadvisor
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: always
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.app-type: cadvisor
    ports:
      - "8080"
