title: について
content:
  value: |-
    <p><strong>Senlutteurs AI</strong>は、セネガルレスリングの魅力を探求するためのデジタルツールです。人工知能（AI）を活用し、セネガルレスリングに関する公開スポーツデータを自動収集しています。このサイトでは、レスラーのプロフィール情報を検索したり、対戦相手、試合日程、結果、判定などの戦績を閲覧したりできます。</p>
    <p>- このサイトはニュースサイトではなく、セネガルのスポーツ文化を促進するためにテクノロジーを活用しているだけです。アスリートを紹介し、彼らのパフォーマンスをアーカイブし、すべてのセネガルレスリングファンがアクセスできるようにすることを目的としています。</p>
    <p>- 誤ったデータを見つけた場合は、いつでもご連絡いただければ修正いたします。確認次第、修正いたします。</p>
    <p>- このサイトに掲載されているYouTube動画またはその他の動画へのリンクは、それぞれの作成者および公式配信者に帰属します。このサイトは、これらの動画コンテンツに対するいかなる所有権も保有していません。動画コンテンツの所有権は作成者に帰属します。このサイトは、インターネット上で既に公開されている動画をインデックスしているだけです。</p>
  format: full_html
