elo_ranking.history:
  path: '/elo-history/{nid}'
  defaults:
    _controller: '\Drupal\elo_ranking\Controller\EloHistoryController::history'
  requirements:
    _permission: 'access content'

# Correction ici : Ajout du préfixe /api et des paramètres dynamiques
elo_ranking.compare:
  path: '/api/elo-ranking/compare/{id1}/{id2}'
  defaults:
    _controller: '\Drupal\elo_ranking\Controller\EloCompareController::compare'
  requirements:
    _permission: 'access content'

#recheck maintenance elo history
elo_ranking.check_status:
  path: '/elo-check-status'
  defaults:
    _controller: '\Drupal\elo_ranking\Controller\EloHistoryController::checkStatus'
  requirements:
    _permission: 'access content'