prompt: "__debug__\r\n1)Lis les 5 derniers posts de la page facebook de senaffiche.com (je ne parle pas du site web mais de la page facebook). Extrait la liste des combats affiches officiels à venir, non encore expirés, y compris TOUS les combats de la carte complète (undercard / affiches secondaires / supporting bouts) mentionnés dans les détails complets de chaque post, même s’ils ne sont pas la tête d’affiche. Lire le texte intégral et toutes les listes d’affiches (même en légende ou en image décrite). Ne pas se limiter aux combats principaux.\r\nFormat json simple sans texte.\r\n2)Complete cette liste en allant en plus sur internet sur les principales page web spécialisés en lutte (dont beuzpro.com comme la page prioritaire spécificque \"https://beuzpro.com/#prochains-evenements\") et extrait aussi la liste des combats à venir non encore expirés et officialisés (publiés) y a moins d'1 mois. Autres pages facebook fiables: \"lutte tv\", \"albourakh events\" ou instagram (comme la page \"azam_live\").\r\n3) Complete cette liste en allant aussi sur youtube et cherche toutes les videos face à face (ou f2f) de lutte senegalaise, publiés ya moins de 1 mois (verifie sur le net que les dates de chaque combats ne sont pas encore expirés)\r\n4) Base toi sur tous ses differents resultats combinés (aggrégés intelligement) ci dessus pour me retourner ces combats à venir uniquement au format json simple (pas de sous niveau, mettre directement la liste unique). champs: date_precise (format Y-m-d), source (au moins 2 mais lien complet), lutteur1 (nom/ecurie, ‘/’ étant séparateur), lutteur2(nom/ecurie), face2face (si dispo, liens videos non inventés des face 2 face (face à face ou face to face ou f2f) du combat ). La video youtube du face 2 face contient éventuellement des url séparés par des virgules si multiple). \r\nImportant: si tu as eu à trouver un combat dont la date a été reportée, alors rajoute la, en prenant soin de mettre à jour sa date précise avec la nouvelle date seulement si elle est rendu officiel. si la date est expiré à ce jour alors ignore le combat. Ignorer les défis entre lutteurs.\r\nNB : si tu tombes sur un lutteur exact \"pape mbaye\", alors sois précis lequel des 3 et remplace le par (Pape Mbaye 2 (fadam) ou Pape Mbaye 2 (keur massar) ou Pape Mbaye Hersent. \r\nIdem si tu tombes sur un lutteur nommé exactement  \"Boy diop \" ou \"Diop 2\" alors sois précis lequel des 3 et remplace le par \"Boy diop 1\" ou \"Boy diop 2\" ou \"Boy diop (mbollo)\" de l'écurie Yeumbel mbollo.\r\nRÈGLE GÉNÉRIQUE D'HOMONYMIE (Pour tous les autres lutteurs) :\r\nL'arène sénégalaise est saturée d'homonymes et les médias en ligne (YouTube, Facebook) coupent ou simplifient systématiquement les noms dans leurs titres (ex: ils écrivent \"Alboury\" pour \"Alboury 2\"). Il est STRICTEMENT INTERDIT de recopier aveuglément le nom brut d'un titre. \r\nPour CHAQUE lutteur extrait, fais une recherche de contrôle pour vérifier s'il existe plusieurs homonymes (numérotations \"2\", suffixes, etc.). Recoupe obligatoirement avec le contexte de l'affiche ou du promoteur pour identifier son identité réelle, et écris TOUJOURS le nom complet et exact dans le JSON final (ex: \"Alboury 2\" au lieu de \"Alboury\").\r\nIgnorer la source: senlutteurs.com.\r\nLa seul réponse que je veux est un seul json aggrégé valide (pas d'autres texte), aprés au moins 2 passages sur l'étape a) ci dessous pour bien compléter les écuries de chaque lutteur dans le flux json final.\r\nNb: \r\na) IMPORTANT, Pour TOUS les lutteurs, fais une recherche individuelle sur internet autres que les pages facebook que j'ai donné, afin de chercher leurs noms d'écurie manquant dans le json final. A chaque fois prend le nom d'écurie cité dans des médias fiables pour un lutteur donné et en cas de doute (choix multiples) alors priorise un seul de ton choix, afin de compléter l’écurie et l’ajouter au format « Nom / Écurie » pour chaque lutteur concerné dans le json final. \r\nb) la date de chaque combat à venir doit etre confirmé par AU MOINS 2 sources différentes ET vérifier si le combat n'est pas reporté ou annulé aux derniers nouvelles concernant la date trouvée sauf s'il s'agit d'une nouvelle date de report officielle.\r\nc) chaque combat dans le flux ne doit pas avoir deja eu lieu, donc VERIFIE OBLIGATOIREMENT sur internet si le meme combat ne s'est pas déjà déroulé y a moins de 2 ans (donc expiré).\r\nIMPORTANT: Retourne UNIQUEMENT un JSON valide ; Le JSON doit commencer par { et finir par } ; AUCUN texte avant ou après ; PAS de ```json ; PAS de caractères parasites ; Virgules correctes ; Toutes les clés entre guillemets doubles.\r\nEx. [{\"date_precise\":\"2026-06-14\",\"source\":[\"https://www.youtube.com/luttetv/\",\"https://www.youtube.com/@ALBOURAKHTV\"],\"lutteur1\":\"Dougar Peulh / École de lutte Balla Gaye\",\"lutteur2\":\"Alboury 2 / Dakar Plateau\"},{\"date_precise\":\"2026-2027\",\"source\":[\"https://www.leral.net/\",\"https://pressafrik.com/\",\"https://www.youtube.com/@ALBOURAKHTV\"],\"lutteur1\":\"Balla Gaye 2 / École de lutte Balla Gaye\",\"lutteur2\":\"Ada Fass / Fass-Benno\"}]"
